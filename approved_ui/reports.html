<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports · Urban Spoon</title>
<link rel="stylesheet" href="shared.css">
<style>
.chart{height:240px;display:flex;align-items:flex-end;gap:10px;padding:8px 4px 0}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#f0663c,#e0301a);min-height:5px}
.bcol span{font-size:10px;color:var(--faint)}
.bars-h{display:grid;gap:11px}
.brow{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center}
.brow .track{height:12px;border-radius:20px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.brow .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#e0301a,#f0663c)}
.brow .lab{font-size:12.5px;font-weight:600}
.brow .val{font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.don{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.don-legend{display:grid;gap:8px}
.leg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.leg i{width:12px;height:12px;border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side"></aside>
  <main class="main">
    <header class="header">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="header-title"><h1>Reports</h1><p>Sales, profit and product performance</p></div>
      <div class="header-spacer"></div>
      <div class="seg" id="range"><button class="active" data-r="today">Today</button><button data-r="week">Week</button><button data-r="month">Month</button></div>
      <button class="btn" id="exportBtn">Export CSV</button>
    </header>
    <div class="content">
      <div class="split" style="grid-template-columns:260px 1fr;align-items:start">

        <section class="panel">
          <div class="panel-head"><div><h2>Reports</h2><p>Pick one</p></div></div>
          <div class="panel-body flush"><div id="repList" class="hint" style="padding:12px">Loading...</div></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div><h2 id="repTitle">Select a report</h2><p id="repDesc">Choose a report from the list</p></div>
            <div class="tools">
              <label class="field" style="margin:0"><span>From</span><input type="date" id="dFrom"></label>
              <label class="field" style="margin:0"><span>To</span><input type="date" id="dTo"></label>
              <button class="btn" id="runBtn">Run</button>
              <button class="btn" id="csvBtn">Export CSV</button>
            </div>
          </div>
          <div class="panel-body flush">
            <div id="repNote" class="note" style="display:none;margin:12px"></div>
            <div id="repBody" style="padding:14px" class="hint">No report loaded yet.</div>
          </div>
        </section>

      </div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<script src="shared_store.js"></script>
<script src="live_store.js"></script>
<script src="access_store.js"></script>
<script src="shell.js" data-active="reports"></script>
<script>
/* V67 — Reports.
   Pehle yeh page localStorage ke seed data par chalta tha: numbers
   khoobsurat the magar customer ke apne karobar se un ka koi taluq nahi
   tha. Ab har raqam database se aati hai (ReportService), aur SAB reports
   ek hi shakl lautati hain {columns, rows, totals} — is liye ek hi UI aur
   ek hi CSV export sab ke liye kaafi hai. */
(function(){
  var $=function(s){return document.querySelector(s)};
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function toast(m,err){var t=$('#toast');t.textContent=m;
    t.className='toast show'+(err?' err':'');clearTimeout(window.__rt);
    window.__rt=setTimeout(function(){t.className='toast'},2400)}
  function num(v){var n=Number(v)||0;
    return n.toLocaleString(undefined,{maximumFractionDigits:2})}

  var current=null, CAT=[];

  function ymd(d){return d.toISOString().slice(0,10)}
  (function defaults(){
    var to=new Date(), from=new Date(); from.setDate(from.getDate()-29);
    $('#dFrom').value=ymd(from); $('#dTo').value=ymd(to);
  })();

  function loadList(){
    if(!window.DBApi){$('#repList').textContent='No server connection.';return}
    var r=DBApi.req('report-list');
    if(!r||!r.ok){$('#repList').textContent=(r&&r.message)||'Could not load the report list.';return}
    CAT=r.reports||[];
    var groups={}, order=[];
    CAT.forEach(function(x){ if(!groups[x.group]){groups[x.group]=[];order.push(x.group)} groups[x.group].push(x); });
    var h='';
    order.forEach(function(g){
      h+='<div style="padding:8px 12px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">'+esc(g)+'</div>';
      groups[g].forEach(function(x){
        h+='<button class="rep-item" data-rep="'+esc(x.id)+'" style="display:block;width:100%;text-align:left;'
          +'padding:9px 12px;border:0;background:none;cursor:pointer;border-left:3px solid transparent">'
          +'<b style="font-size:12.5px;display:block">'+esc(x.name)+'</b>'
          +'<span class="hint" style="font-size:11px">'+esc(x.desc)+'</span></button>';
      });
    });
    h+='<div style="padding:10px 12px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Your own</div>'
      +'<button class="rep-item" data-rep="__custom" style="display:block;width:100%;text-align:left;'
      +'padding:9px 12px;border:0;background:none;cursor:pointer;border-left:3px solid transparent">'
      +'<b style="font-size:12.5px;display:block">Custom report</b>'
      +'<span class="hint" style="font-size:11px">Build your own from your live data</span></button>';
    $('#repList').innerHTML=h;
    $('#repList').className='';
  }

  function mark(id){
    Array.prototype.forEach.call(document.querySelectorAll('[data-rep]'),function(b){
      var on=b.getAttribute('data-rep')===id;
      b.style.borderLeftColor=on?'var(--brand)':'transparent';
      b.style.background=on?'var(--brand-soft)':'none';
    });
  }

  function run(id){
    if(!id)return;
    current=id; mark(id);
    var meta=CAT.filter(function(x){return x.id===id})[0]||{};
    $('#repTitle').textContent=meta.name||'Report';
    $('#repDesc').textContent=meta.desc||'';
    $('#repBody').innerHTML='<span class="hint">Running...</span>';
    $('#repNote').style.display='none';

    var r=DBApi.req('report-run&id='+encodeURIComponent(id)
        +'&from='+encodeURIComponent($('#dFrom').value)
        +'&to='+encodeURIComponent($('#dTo').value));
    /* Jawab check hota hai — nakami par asli wajah, khali table nahi. */
    if(!r||!r.ok){
      $('#repBody').innerHTML='<span class="hint">'+esc((r&&r.message)||'Report could not be run.')+'</span>';
      return;
    }
    draw(r.report);
  }

  function draw(rep){
    if(rep.note){ $('#repNote').textContent=rep.note; $('#repNote').style.display=''; }
    if(!rep.rows||!rep.rows.length){
      $('#repBody').innerHTML='<span class="hint">No data for '+esc(rep.from)+' to '+esc(rep.to)+'.</span>';
      return;
    }
    var h='<div class="table-wrap"><table class="table"><thead><tr>';
    rep.columns.forEach(function(c){ h+='<th'+(c.n?' class="num"':'')+'>'+esc(c.l)+'</th>'; });
    h+='</tr></thead><tbody>';
    rep.rows.forEach(function(row){
      h+='<tr>';
      rep.columns.forEach(function(c,i){
        var v=row[c.k];
        h+='<td'+(c.n?' class="num"':(i===0?' class="t-main"':''))+'>'+(c.n?num(v):esc(v))+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody>';
    if(rep.totals&&Object.keys(rep.totals).length){
      h+='<tfoot><tr>';
      rep.columns.forEach(function(c,i){
        if(i===0){h+='<td class="t-main"><b>Total</b></td>';return}
        h+='<td'+(c.n?' class="num"':'')+'>'+(rep.totals[c.k]!==undefined?'<b>'+num(rep.totals[c.k])+'</b>':'')+'</td>';
      });
      h+='</tr></tfoot>';
    }
    h+='</table></div>';
    $('#repBody').innerHTML=h;
  }

  /* ---------------- Custom report builder ----------------
     Customer apni marzi ki report bana sake — magar SQL likhe baghair.
     Sab kuch server ki registry se aata hai (source, grouping, figures),
     is liye user ka koi harf SQL mein nahi jata. */
  var SRC=null;
  function customUI(){
    current=null; mark('');
    $('#repTitle').textContent='Custom report';
    $('#repDesc').textContent='Build your own from your live data';
    $('#repNote').style.display='none';
    if(!SRC){ var s=DBApi.req('report-sources'); if(s&&s.ok)SRC=s.sources; }
    if(!SRC){ $('#repBody').innerHTML='<span class="hint">Could not load the report builder.</span>'; return; }

    var keys=Object.keys(SRC);
    $('#repBody').innerHTML=
      '<div class="form-grid" style="max-width:640px">'
      +'<label class="field"><span>Data source</span><select id="cbSrc">'
      + keys.map(function(k){return '<option value="'+esc(k)+'">'+esc(SRC[k].label)+'</option>'}).join('')
      +'</select></label>'
      +'<label class="field"><span>Group by</span><select id="cbGrp"></select></label>'
      +'<div class="field full"><span>Figures to show</span><div id="cbMeas" '
      +'style="display:flex;flex-wrap:wrap;gap:10px;padding:6px 0"></div></div>'
      +'<label class="field"><span>Sort by</span><select id="cbSort"></select></label>'
      +'<label class="field"><span>Max rows</span><input id="cbLimit" type="number" value="100" min="5" max="500"></label>'
      +'<div class="field full"><button class="btn primary" id="cbRun">Run my report</button></div>'
      +'</div><div id="cbOut" style="margin-top:14px"></div>';

    function fill(){
      var s=SRC[$('#cbSrc').value];
      $('#cbGrp').innerHTML=Object.keys(s.group_by).map(function(k){
        return '<option value="'+esc(k)+'">'+esc(s.group_by[k].label)+'</option>'}).join('');
      $('#cbMeas').innerHTML=Object.keys(s.measures).map(function(k,i){
        return '<label class="permission-row" style="gap:6px"><input type="checkbox" value="'+esc(k)+'"'
          +(i<2?' checked':'')+'> '+esc(s.measures[k].label)+'</label>'}).join('');
      sortOpts();
    }
    function sortOpts(){
      var s=SRC[$('#cbSrc').value];
      var on=[].slice.call(document.querySelectorAll('#cbMeas input:checked')).map(function(c){return c.value});
      $('#cbSort').innerHTML='<option value="g">'+esc(s.group_by[$('#cbGrp').value].label)+'</option>'
        + on.map(function(k){return '<option value="'+esc(k)+'">'+esc(s.measures[k].label)+'</option>'}).join('');
      if(on.length)$('#cbSort').value=on[0];
    }
    $('#cbSrc').onchange=fill;
    $('#cbGrp').onchange=sortOpts;
    $('#cbMeas').onchange=sortOpts;
    fill();

    $('#cbRun').onclick=function(){
      var meas=[].slice.call(document.querySelectorAll('#cbMeas input:checked')).map(function(c){return c.value});
      if(!meas.length){toast('Pick at least one figure to show',true);return}
      var r=DBApi.req('report-custom',{spec:{source:$('#cbSrc').value,group:$('#cbGrp').value,
        measures:meas,sort:$('#cbSort').value,limit:Number($('#cbLimit').value||100)},
        from:$('#dFrom').value,to:$('#dTo').value});
      if(!r||!r.ok){ $('#cbOut').innerHTML='<span class="hint">'+esc((r&&r.message)||'Report failed')+'</span>'; return; }
      var keep=$('#repBody').innerHTML;
      draw(r.report);
      var out=$('#repBody').innerHTML;
      $('#repBody').innerHTML=keep;
      $('#cbOut').innerHTML=out;
      /* Builder screen par hi rehta hai — warna har run par form gayab
         ho jata aur user ko dobara sab bharna parta. */
      $('#cbSrc').onchange=fill; $('#cbGrp').onchange=sortOpts; $('#cbMeas').onchange=sortOpts;
      $('#cbRun').onclick=arguments.callee;
    };
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-rep]');
    if(b){ var id=b.getAttribute('data-rep');
      if(id==='__custom'){ customUI(); return; }
      run(id); }
  });
  $('#runBtn').onclick=function(){ current?run(current):toast('Pick a report first',true) };
  $('#csvBtn').onclick=function(){
    if(!current){toast('Pick a report first',true);return}
    window.location='/api.php?action=report-csv&id='+encodeURIComponent(current)
      +'&from='+encodeURIComponent($('#dFrom').value)+'&to='+encodeURIComponent($('#dTo').value);
  };

  loadList();
  run('sales_summary');
})();
</script>
</body>
</html>
