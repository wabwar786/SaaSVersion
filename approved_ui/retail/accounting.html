<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accounting / Cash · Retail OS</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side"></aside>
  <main class="main">
    <header class="header">
      <button class="menu-btn" id="menuBtn">&#9776;</button>
      <div class="header-title"><h1>Accounting / Cash</h1><p>Cash in, cash out aur din ka hisaab</p></div>
      <div class="header-spacer"></div>
    </header>
    <div class="content">
      <div class="kpis">
        <div class="kpi ok"><div class="lab">Cash sales</div><div class="val" id="aCash">—</div><div class="sub">aaj</div></div>
        <div class="kpi info"><div class="lab">Card sales</div><div class="val" id="aCard">—</div><div class="sub">aaj</div></div>
        <div class="kpi warn"><div class="lab">Credit (khata)</div><div class="val" id="aCredit">—</div><div class="sub">aaj bikra, paisa nahi aaya</div></div>
        <div class="kpi violet"><div class="lab">Expenses</div><div class="val" id="aExp">—</div><div class="sub">cash se</div></div>
      </div>
      <section class="panel">
        <div class="panel-head"><div><h2>Din ka hisaab</h2><p>Drawer mein kitna hona chahiye</p></div></div>
        <div class="panel-body"><div class="table-wrap"><table class="table">
          <tbody id="ledger"></tbody></table></div></div>
      </section>
      <section class="panel" style="margin-top:14px">
        <div class="panel-head"><div><h2>Payment method breakdown</h2></div></div>
        <div class="panel-body flush"><div class="table-wrap"><table class="table">
          <thead><tr><th>Method</th><th class="num">Bills</th><th class="num">Amount</th></tr></thead>
          <tbody id="methods"></tbody></table></div></div>
      </section>
</div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<script src="region.js"></script>
<script src="store.js"></script>
<script src="retail_api.js"></script>
<script src="shell.js" data-active="accounting"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var S=window.RetailStore,R=window.Region,money=R.money;
  var sales=S.get('sales')||[];
  var cash=0,card=0,credit=0,mc={};
  sales.forEach(function(s){
    cash+=Number(s.paid_cash||0); card+=Number(s.paid_card||0);
    if(s.status==='Credit')credit+=Number(s.total||0);
    var m=s.status==='Credit'?'Khata / Credit':(Number(s.paid_card)>0?(Number(s.paid_cash)>0?'Cash + Card':'Card'):'Cash');
    mc[m]=mc[m]||{n:0,a:0}; mc[m].n++; mc[m].a+=Number(s.total||0);
  });
  var exp=0; (S.get('expenses')||[]).forEach(function(e){ if((e.method||'Cash')==='Cash') exp+=Number(e.amount||0); });
  $('aCash').textContent=money(cash); $('aCard').textContent=money(card);
  $('aCredit').textContent=money(credit); $('aExp').textContent=money(exp);

  var rows=[['Opening cash (counters)',0,''],['Cash sales',cash,'ok'],['Cash expenses',-exp,'warn'],
            ['Expected in drawer',cash-exp,'brand']];
  $('ledger').innerHTML=rows.map(function(r){
    var strong=r[2]==='brand';
    return '<tr'+(strong?' style="background:var(--surface-2)"':'')+'><td'+(strong?' style="font-weight:700"':'')+'>'+r[0]+'</td>'+
      '<td class="num"'+(strong?' style="font-weight:800;font-family:var(--display)"':'')+'>'+money(r[1])+'</td></tr>';
  }).join('');

  $('methods').innerHTML=Object.keys(mc).map(function(k){
    return '<tr><td>'+k+'</td><td class="num">'+mc[k].n+'</td><td class="num"><b>'+money(mc[k].a)+'</b></td></tr>';
  }).join('')||'<tr><td colspan="3"><div class="empty" style="padding:24px"><h3>Aaj koi bill nahi</h3></div></td></tr>';
})();
</script>
</body>
</html>
