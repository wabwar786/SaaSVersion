<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmartPOS · Sign in</title>
<link rel="stylesheet" href="shared.css">
<style>
/* V195 — LOGIN PAGE
   1. Mobile par sab se upar ek bara laal hissa (280px+) tha; form neeche
      dhakel diya jata aur keyboard khulte hi chhup jata. Ab mobile par
      sirf ek patli pati (logo + SmartPOS), aur foran form.
   2. Kisi business ka naam nahi. Yeh page sab businesses ka ek hi
      darwaza hai: jo user login kare, USI ka business khulta hai.
      (brand.js is page par naam nahi lagata — router.php dekhein.) */
body{margin:0;background:var(--bg)}
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.side{background:#1b1917;color:#fff;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
.mark{display:flex;align-items:center;gap:12px}
.mark i{width:44px;height:44px;border-radius:12px;background:var(--brand);display:grid;place-items:center;font:900 20px var(--display);font-style:normal;color:#fff}
.mark b{font:800 20px var(--display);letter-spacing:-.01em}
.side h1{font-family:var(--display);font-size:36px;line-height:1.15;margin:0;max-width:440px}
.side p{color:rgba(255,255,255,.72);font-size:14px;line-height:1.7;max-width:420px;margin:14px 0 0}
.side small{color:rgba(255,255,255,.5);font-size:12px}
.panel{display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:min(400px,100%)}
.top{display:none}
.card h2{font-family:var(--display);font-size:26px;margin:0}
.card>p{margin:6px 0 20px;color:var(--muted);font-size:13.5px}
.field-g{display:block;margin-top:14px}
.field-g span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field-g input{width:100%;box-sizing:border-box;height:50px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 14px;font-size:16px;outline:none;transition:.14s}
.field-g input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;height:38px;padding:0 10px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.primary-btn{width:100%;height:50px;border:0;border-radius:11px;background:var(--brand);color:#fff;margin-top:20px;font-size:15px;font-weight:700;cursor:pointer;transition:.14s}
.primary-btn:hover{background:var(--brand-ink)}
.primary-btn[disabled]{opacity:.6;cursor:wait}
.ghost-btn{width:100%;height:44px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);color:var(--ink-2);margin-top:10px;font-size:13px;font-weight:600;cursor:pointer}
.auth-foot{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.auth-foot a{color:var(--brand-ink);text-decoration:none;font-weight:700}
.err{margin-top:12px;padding:10px 12px;background:var(--danger-soft);border:1px solid var(--danger-line);border-radius:9px;color:var(--danger);font-size:13px;display:none}
.err.show{display:block}
@media(max-width:860px){
  .auth{grid-template-columns:1fr;align-content:start}
  .side{display:none}
  .top{display:flex;align-items:center;gap:10px;margin:0 0 28px}
  .top i{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font:900 16px var(--display);font-style:normal;color:#fff}
  .top b{font:800 17px var(--display)}
  .panel{align-items:flex-start;padding:28px 20px 24px}
  .card h2{font-size:24px}
  #fullscreenBtn{display:none}
}
</style>
</head>
<body>
<div class="auth">
  <section class="side" aria-hidden="true">
    <div class="mark"><i>S</i><b>SmartPOS</b></div>
    <div>
      <h1>Point of sale for restaurants and stores</h1>
      <p>Billing, kitchen, stock, purchasing and reports. Works offline and keeps the cloud in step.</p>
    </div>
    <small>Wabwar Software House</small>
  </section>
  <section class="panel">
    <div class="card">
      <div class="top"><i>S</i><b>SmartPOS</b></div>
      <h2>Sign in</h2>
      <p>Your username opens your own business.</p>
      <label class="field-g"><span>Username or email</span><input id="email" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="username" inputmode="email"></label>
      <label class="field-g"><span>Password</span><span class="pw"><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" id="pwShow" aria-label="Show password">Show</button></span></label>
      <div class="err" id="error" role="alert"></div>
      <button class="primary-btn" id="loginBtn">Sign in</button>
      <button class="ghost-btn" id="fullscreenBtn">Open in full screen</button>
      <div class="auth-foot">New business? <a href="register.html">Start a free 14-day trial</a></div>
    </div>
  </section>
</div>
<script src="access_store.js"></script>
<script>
const $=s=>document.querySelector(s);
function login(){const r=RestaurantAccess.login($('#email').value.trim(),$('#password').value);if(!r.ok){$('#error').textContent=r.message;$('#error').classList.add('show');return}location.href='index.html'}
$('#loginBtn').onclick=login;
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
$('#pwShow').onclick=function(){var p=$('#password');var s=p.type==='password';p.type=s?'text':'password';this.textContent=s?'Hide':'Show';this.setAttribute('aria-label',s?'Hide password':'Show password')};
</script>
<script>
/* If the licence has expired on this offline node, do not leave the
   customer staring at a sign-in they can never pass — send them to the
   activation screen where the key goes. */
(function(){
  if(window.APP_ROLE==='cloud')return;
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/api.php?action=licence-status',true);
    x.onload=function(){
      try{
        var r=JSON.parse(x.responseText||'{}');
        if(r.ok && r.licence && r.licence.expired) location.href='/activate.html?expired=1';
      }catch(e){}
    };
    x.send();
  }catch(e){}
})();
</script>
</body>
</html>
