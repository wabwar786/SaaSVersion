<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu &amp; Categories</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ============================================================
   V146 — yeh safha ab ASLI menu_items dikhata hai.

   Pehle yeh `module.js` ka generic CRUD tha jo `ui_records` mein likhta
   tha — `menu_items` ko chhoota hi nahi tha. Is liye POS par banaya item
   yahan nazar nahi aata tha, aur yahan banaya "item" POS par kabhi bika
   hi nahi. Ab dono ek hi table aur ek hi popup (`item_dialog.js`) par
   hain.
   ============================================================ */
.mm-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.mm-find{flex:1 1 220px;min-width:170px;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;font:inherit;font-size:13.5px;background:var(--surface)}
.mm-find:focus{outline:none;border-color:var(--brand-line)}
.mm-sel{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;
  font-size:13.5px;background:var(--surface)}
.mm-count{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}

.mm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:15px}
.mm-kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mm-kpi span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mm-kpi b{display:block;font-family:var(--display);font-size:21px;margin-top:3px}

.mm-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mm-tbl{width:100%;border-collapse:collapse;font-size:13.4px}
.mm-tbl th,.mm-tbl td{padding:10px 13px;text-align:left;border-top:1px solid var(--line)}
.mm-tbl th{background:var(--surface-2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);border-top:0;white-space:nowrap}
.mm-tbl tbody tr:hover{background:var(--surface-2)}
/* V166 — select karne ka column aur chuni hui cheezon ki patti. */
.mm-tbl th.mm-cb,.mm-tbl td.mm-cb{width:38px;padding-right:0;text-align:center}
.mm-tbl .mm-cb input{width:16px;height:16px;cursor:pointer;vertical-align:middle}
.mm-tbl tbody tr.mm-on{background:#fff9ec}
.mm-tbl tbody tr.mm-on:hover{background:#fff4de}
.mm-selbar{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:9px 13px;
  background:#fff6e5;border:1px solid #f0d9a8;border-radius:10px}
.mm-selbar b{font-size:12.5px;color:#8a5a00}
.mm-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mm-name b{display:block}
.mm-name span{font-size:11.5px;color:var(--muted)}
.mm-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;border:1px solid}
.mm-tag.none{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.mm-tag.direct{color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.mm-tag.recipe{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.mm-tag.off{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-line)}
.mm-stock{font-size:11.8px;color:var(--muted)}
.mm-empty{padding:46px 20px;text-align:center;color:var(--muted)}
.mm-empty .ic{font-size:30px;opacity:.4;display:block;margin-bottom:8px}
@media(max-width:760px){
  .mm-tbl th:nth-child(3),.mm-tbl td:nth-child(3),
  .mm-tbl th:nth-child(5),.mm-tbl td:nth-child(5){display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side"></aside>
  <main class="main">
    <header class="header">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="header-title"><h1>Menu &amp; Categories</h1>
        <p>The same items the Sale Point sells</p></div>
      <div class="header-spacer"></div>
      <button class="btn" id="mmStock">Set up stock</button>
      <button class="btn" id="mmCat">+ Category</button>
      <!-- V158 — category ki tarteeb. `sort_order` column pehle se thi
           magar usay badalne ka koi rasta nahi tha: har nayi category
           99 par banti thi aur Sale Point un ko naam ke hisaab se
           lagata tha. -->
      <button class="btn" id="mmCatOrder">Category order</button>
      <button class="btn primary" id="mmAdd">+ Add item</button>
    </header>
    <div class="content">
      <div class="mm-kpis" id="mmKpis"></div>
      <div class="mm-bar">
        <input class="mm-find" id="mmQ" placeholder="Search item or category…">
        <select class="mm-sel" id="mmCatF"><option value="">All categories</option></select>
        <select class="mm-sel" id="mmModeF">
          <option value="">Any stock setting</option>
          <option value="none">No stock</option>
          <option value="direct">Same item</option>
          <option value="recipe">By recipe</option>
        </select>
        <span class="mm-count" id="mmCount"></span>
      </div>
      <!-- V166 — chuni hui cheezon ki patti. Tab tak chhupi rehti hai
           jab tak ek bhi checkbox na lage, taake aam istemal mein
           screen par ek bhi cheez zyada na ho. -->
      <div class="mm-selbar" id="mmSelBar" style="display:none">
        <b id="mmSelCount">0 selected</b>
        <span style="flex:1"></span>
        <button class="btn sm" id="mmSelClear">Clear</button>
        <button class="btn sm danger" id="mmSelDel">Delete selected</button>
      </div>
      <div class="mm-wrap">
        <table class="mm-tbl">
          <thead><tr>
            <th class="mm-cb"><input type="checkbox" id="mmAll" title="Select all shown"></th>
            <th>Item</th><th>Stock when sold</th><th class="num">Food cost</th>
            <th class="num">Price</th><th class="num">Margin</th><th></th>
          </tr></thead>
          <tbody id="mmRows"></tbody>
        </table>
        <div class="mm-empty" id="mmEmpty" style="display:none">
          <span class="ic">☰</span>No items yet. Use <b>+ Add item</b> to create the first one.
        </div>
      </div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim"></div>

<script src="shared_store.js"></script>
<script src="live_store.js"></script>
<script src="access_store.js"></script>
<script src="shell.js" data-active="menu"></script>
<script src="item_dialog.js"></script>
<script>
(function(){
  var ROWS=[];
  /* V166 — jo is waqt screen par nazar aa rahe hain (filter ke baad). */
  var SHOWN=[];

  function req(a,p){ return (window.DBApi&&DBApi.req)?DBApi.req(a,p):{ok:false,message:'Offline'}; }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
  function money(n){
    var cur=(window.APP_BRAND&&APP_BRAND.currency)||'PKR';
    return cur+' '+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
  }
  function toast(m){
    var t=document.createElement('div');
    t.textContent=m;
    t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1b1917;'+
      'color:#fff;padding:10px 17px;border-radius:10px;font-size:13.5px;z-index:9500;box-shadow:0 8px 26px rgba(0,0,0,.26)';
    document.body.appendChild(t);
    setTimeout(function(){t.remove()},2600);
  }

  function load(){
    var r=req('menu-items');
    if(!r||!r.ok){ toast((r&&r.message)||'Could not load the menu'); ROWS=[]; }
    else ROWS=r.items||[];
    var cats={},sel=document.getElementById('mmCatF'),keep=sel.value;
    ROWS.forEach(function(x){cats[x.category]=1});
    sel.innerHTML='<option value="">All categories</option>'+Object.keys(cats).sort().map(function(c){
      return '<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('');
    sel.value=keep;
    paint();
  }

  function paint(){
    var q=(document.getElementById('mmQ').value||'').trim().toLowerCase();
    var cf=document.getElementById('mmCatF').value;
    var mf=document.getElementById('mmModeF').value;

    var list=ROWS.filter(function(x){
      if(cf&&x.category!==cf)return false;
      if(mf&&x.mode!==mf)return false;
      if(q&&(x.name+' '+x.category).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
    SHOWN=list;

    /* KPIs — asli ginti, demo ke hisaab se nahi. */
    var tracked=ROWS.filter(function(x){return x.mode!=='none'}).length;
    var avg=ROWS.length?ROWS.reduce(function(a,b){return a+b.price},0)/ROWS.length:0;
    document.getElementById('mmKpis').innerHTML=
      kpi('Menu items',ROWS.length)+
      kpi('Stock linked',tracked+' of '+ROWS.length)+
      kpi('Inactive',ROWS.filter(function(x){return !x.active}).length)+
      kpi('Average price',money(avg));

    document.getElementById('mmCount').textContent=list.length+' shown';
    document.getElementById('mmEmpty').style.display=ROWS.length?'none':'';

    document.getElementById('mmRows').innerHTML=list.map(function(x){
      var m=x.price?Math.round((1-(x.cost||0)/x.price)*100):0;
      var tag=x.mode==='direct'?'<span class="mm-tag direct">Same item</span>'
             :x.mode==='recipe'?'<span class="mm-tag recipe">Recipe</span>'
             :'<span class="mm-tag none">No stock</span>';
      return '<tr'+(SEL[x.id]?' class="mm-on"':'')+'>'+
        '<td class="mm-cb"><input type="checkbox" data-pick="'+esc(x.id)+'"'+
          (SEL[x.id]?' checked':'')+'></td>'+
        '<td class="mm-name"><b>'+esc(x.name)+(x.active?'':' <span class="mm-tag off">Inactive</span>')+'</b>'+
          /* V158 — Sale Point ki tarteeb ka number saath hi. 99 default
             hai (yani tarteeb set nahi), us ko dikhane ka faida nahi. */
          '<span>'+esc(x.category)+
            (x.sort_order!=null&&x.sort_order!==99?(' · #'+x.sort_order):'')+
            (x.variants?(' · '+x.variants+' option'+(x.variants===1?'':'s')):'')+'</span></td>'+
        '<td>'+tag+'<div class="mm-stock">'+esc(x.stock_label)+'</div></td>'+
        '<td class="num">'+(x.cost?money(x.cost):'<span style="color:var(--faint)">—</span>')+'</td>'+
        '<td class="num"><b>'+money(x.price)+'</b></td>'+
        '<td class="num">'+(x.cost?('<b style="color:'+(m>=60?'var(--ok)':'var(--warn)')+'">'+m+'%</b>')
                                  :'<span style="color:var(--faint)">—</span>')+'</td>'+
        '<td class="num">'+
          (x.mode==='none'?('<button class="btn sm" data-stock="'+esc(x.id)+'" '+
             'title="Isi naam ka inventory item bana kar jor do">Make stock item</button> '):'')+
          '<button class="btn sm" data-edit="'+esc(x.id)+'">Edit</button> '+
          /* V163 — DELETE. Is screen par item hatane ka koi rasta tha hi
             nahi: banane ke baad sirf Inactive kiya ja sakta tha, aur wo
             bhi item dialog ke andar se. Delete SOFT hai — purane bill
             jaise ke waise chhapte hain. */
          '<button class="btn sm danger" data-delitem="'+esc(x.id)+'" '+
            'data-name="'+esc(x.name)+'">Delete</button></td>'+
      '</tr>';
    }).join('');
    syncSel();
  }
  function kpi(l,v){return '<div class="mm-kpi"><span>'+esc(l)+'</span><b>'+esc(v)+'</b></div>'}

  /* ============================================================
     V166 — KAI ITEMS EK SATH.

     Pehle har item par alag Delete dabana parta tha. Akorwal ka menu
     saaf karne ke liye 49 dafa confirm — log aise mein seedha
     database par jate hain, aur wahan se purane bill tootte hain.

     SEL mein sirf ids rakhi jati hain, poore row nahi: filter badalne
     par list dobara banti hai aur purane row ke reference bekaar ho
     jate. Jo item filter ki wajah se nazar nahi aa raha, uska select
     bhi khud hat jata hai — warna banda "3 selected" parh kar koi
     aisi cheez delete kar deta jo screen par thi hi nahi.
     ============================================================ */
  var SEL={};

  function shownRows(){
    return SHOWN.filter(function(x){return SEL[x.id]});
  }
  function syncSel(){
    /* Jo ab nazar nahi aa raha, us ka select bhi gaya. */
    var vis={}; SHOWN.forEach(function(x){vis[x.id]=1});
    Object.keys(SEL).forEach(function(id){ if(!vis[id]) delete SEL[id]; });

    var picked=shownRows(), n=picked.length;
    var bar=document.getElementById('mmSelBar');
    bar.style.display = n ? '' : 'none';
    document.getElementById('mmSelCount').textContent =
      n + ' item' + (n===1?'':'s') + ' selected';
    var all=document.getElementById('mmAll');
    all.checked = n>0 && n===SHOWN.length;
    all.indeterminate = n>0 && n<SHOWN.length;
  }

  document.getElementById('mmAll').addEventListener('change',function(){
    if(this.checked) SHOWN.forEach(function(x){SEL[x.id]=1});
    else SEL={};
    paint();
  });
  document.getElementById('mmSelClear').addEventListener('click',function(){
    SEL={}; paint();
  });
  document.getElementById('mmSelDel').addEventListener('click',function(){
    var picked=shownRows();
    if(!picked.length)return;
    if(!window.DeleteKit||!window.DeleteKit.confirmMany){
      toast('Delete could not load - refresh the page'); return;
    }
    window.DeleteKit.confirmMany({
      entity:'menu_item',
      items:picked.map(function(x){return {id:x.id,name:x.name}}),
      title:'Delete '+picked.length+' menu item'+(picked.length===1?'':'s')+'?',
      note:'Purane bill mehfooz rehte hain — yeh items un par waise hi chhapte rahenge. '
          +'Sirf Sale Point se hat jayenge.',
      onDone:function(){ SEL={}; load(); }
    });
  });

  /* V166 — row ka checkbox. `change` par is liye ke keyboard (space)
     se bhi theek chale, sirf mouse se nahi. */
  document.getElementById('mmRows').addEventListener('change',function(e){
    var cb=e.target.closest('[data-pick]');
    if(!cb)return;
    var id=cb.getAttribute('data-pick');
    if(cb.checked)SEL[id]=1; else delete SEL[id];
    var tr=cb.closest('tr');
    if(tr)tr.className=cb.checked?'mm-on':'';
    syncSel();
  });

  document.getElementById('mmRows').addEventListener('click',function(e){
    /* Checkbox par click row ke baqi handlers tak na jaye. */
    if(e.target.closest('[data-pick]'))return;
    /* V149 — ek item ka stock yahin se. Customer ne theek kaha tha:
       "aik hi kaam 2,2 bar krna mushkil hai" — pehle har menu item
       dobara Inventory mein haath se banana parta tha. */
    var sb=e.target.closest('[data-stock]');
    if(sb){
      sb.disabled=true; sb.textContent='…';
      var rr=req('menu-stock-setup',{ids:[sb.getAttribute('data-stock')]});
      if(!rr||!rr.ok){ sb.disabled=false; sb.textContent='Make stock item';
                       toast((rr&&rr.message)||'Could not set up stock'); return; }
      toast(rr.created?('Stock item ban gaya — ab picker mein bhi hai')
                      :(rr.linked?'Pehle se mojood inventory item se jor diya'
                                 :'Is item ka stock pehle se set tha'));
      load(); return;
    }
    /* V163 — item delete. Server ka faisla hi aakhri hai: menu item ka
       delete SOFT hai (`deleted_at`), is liye purane bill bilkul waise
       hi chhapte rehte hain — sirf aage bikna band ho jata hai. */
    var db=e.target.closest('[data-delitem]');
    if(db){
      if(!window.DeleteKit){toast('Delete could not load - refresh the page');return}
      window.DeleteKit.confirm({entity:'menu_item',id:db.getAttribute('data-delitem'),
        name:db.getAttribute('data-name')||'',what:'Menu item',
        title:'Delete this item?',
        warning:'Sale Point par yeh item aage nazar nahi aayega. Purane bill waise ke waise rehte hain.'});
      return;
    }

    var b=e.target.closest('[data-edit]'); if(!b)return;
    ItemDialog.open({id:b.getAttribute('data-edit'),onSaved:function(){toast('Item saved');load();}});
  });

  /* Poore menu ka stock ek click mein. Dobara dabana mehfooz hai:
     jo pehle se set hai (khaas kar recipe wale) wo chhoote nahi. */
  document.getElementById('mmStock').onclick=function(){
    var pend=ROWS.filter(function(x){return x.mode==='none'}).length;
    if(!pend){ toast('Har item ka stock pehle se set hai'); return; }
    if(!confirm(pend+' item ka inventory banaya jaye? \n\nHar item usi naam se stock '+
                'ban jayega aur jor diya jayega (1 unit per sale). Jo pehle se set hain '+
                'un ko haath nahi lagega.')) return;
    var btn=this; btn.disabled=true; btn.textContent='Ban raha hai…';
    var r=req('menu-stock-setup',{});
    btn.disabled=false; btn.textContent='Set up stock';
    if(!r||!r.ok){ toast((r&&r.message)||'Could not set up stock'); return; }
    toast(r.created+' naye bane, '+r.linked+' pehle se mojood se jore, '+r.skipped+' chhute');
    load();
  };
  document.getElementById('mmAdd').onclick=function(){
    ItemDialog.open({onSaved:function(r,d){toast(d.name+' created');load();}});
  };

  /* Category — wahi endpoint jo POS use karta hai, is liye dono taraf
     ek hi fehrist rehti hai. */
  document.getElementById('mmCat').onclick=function(){
    var n=prompt('New category name');
    if(n===null)return;
    n=n.trim(); if(!n)return;
    var r=req('menu-category-create',{name:n});
    if(!r||!r.ok){toast((r&&r.message)||'Could not create the category');return}
    toast('Category "'+n+'" added'); load();
  };

  /* ============================================================
     V158 — CATEGORY ORDER.

     Chhota number pehle. Jo categories barabar number par hon wo
     apas mein naam ke hisaab se lagti hain — yani purana rawaiya
     kahin jata nahi, bas us ke ooper qaboo mil jata hai.

     Drag-and-drop jaan boojh kar nahi rakha: yeh screen touch POS
     par bhi khulti hai, aur wahan drag ki tarteeb barbad karna
     bohot aasan hai. Number likhna har jagah chalta hai.
     ============================================================ */
  document.getElementById('mmCatOrder').onclick=function(){
    var r=req('menu-categories');
    if(!r||!r.ok){ toast((r&&r.message)||'Could not load categories'); return; }
    var cats=r.rows||[];
    if(!cats.length){ toast('Pehle koi category banayein'); return; }

    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(20,16,12,.46);z-index:9400;'+
      'display:flex;align-items:center;justify-content:center;padding:18px';
    ov.innerHTML='<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;'+
      'max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.28)">'+
      '<div style="padding:15px 18px;border-bottom:1px solid #eee7df">'+
        '<h3 style="margin:0;font-size:15.5px">Categories</h3>'+
        '<p style="margin:4px 0 0;font-size:12px;color:#8a8278">Chhota number pehle aata hai. '+
        'Barabar number waali categories naam ke hisaab se lagti hain. '+
        'Category hatane ke liye us ke saamne <b>&times;</b> dabayein, '+
        'ya kai ek sath chun kar <b>Delete selected</b>.</p></div>'+
      /* V166 — chuni hui categories ki patti. Items wali screen jaisi hi. */
      '<div id="coSelBar" style="display:none;align-items:center;gap:9px;padding:9px 18px;'+
        'background:#fff6e5;border-bottom:1px solid #f0d9a8">'+
        '<b id="coSelCount" style="font-size:12.5px;color:#8a5a00"></b>'+
        '<span style="flex:1"></span>'+
        '<button class="btn sm" id="coSelClear">Clear</button>'+
        '<button class="btn sm danger" id="coSelDel">Delete selected</button></div>'+
      '<div id="coBody" style="padding:12px 18px;overflow:auto;flex:1"></div>'+
      '<div style="padding:12px 18px;border-top:1px solid #eee7df;display:flex;gap:8px;justify-content:flex-end">'+
        '<button class="btn" id="coCancel">Cancel</button>'+
        '<button class="btn primary" id="coSave">Save order</button></div></div>';

    ov.querySelector('#coBody').innerHTML=cats.map(function(c){
      return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0">'+
        '<input type="checkbox" data-cpick="'+esc(c.id)+'" data-cname="'+esc(c.name)+'" '+
          'title="Select" style="width:16px;height:16px;flex:0 0 auto">'+
        '<input type="number" step="1" min="0" data-cid="'+esc(c.id)+'" value="'+
        (c.sort_order==null?99:Number(c.sort_order))+
        '" style="width:72px;padding:6px 8px;border:1px solid #e3dcd2;border-radius:8px;font-weight:700">'+
        '<span style="font-size:13.5px;flex:1">'+esc(c.name)+'</span>'+
        /* V163 — category hatane ka rasta. Server khud rok deta hai agar
           category ke andar item maujood hon ("move or remove them
           first"), is liye yahan dobara pehra lagane ki zaroorat nahi. */
        '<button class="btn sm danger" data-delcat="'+esc(c.id)+'" '+
          'data-name="'+esc(c.name)+'" title="Yeh category hata dein">&times;</button></div>';
    }).join('');

    /* ============================================================
       V166 — KAI CATEGORIES EK SATH.

       Ek shart yaad rakhni hai: jis category ke andar item para ho wo
       delete NAHI hoti (server saaf inkar karta hai). Is liye dialog
       mein "Inside items bhi delete karein" ka option hai — us soorat
       mein pehle items jate hain, phir categories. Ulta karne par har
       category BLOCKED hoti aur kuch bhi na hota.
       ============================================================ */
    function coPicked(){
      return Array.prototype.slice.call(ov.querySelectorAll('[data-cpick]:checked'))
        .map(function(el){ return {id:el.getAttribute('data-cpick'),
                                   name:el.getAttribute('data-cname')||''}; });
    }
    function coSync(){
      var n=coPicked().length;
      ov.querySelector('#coSelBar').style.display = n ? 'flex' : 'none';
      ov.querySelector('#coSelCount').textContent =
        n + ' categor' + (n===1?'y':'ies') + ' selected';
    }
    ov.addEventListener('change',function(e){
      if(e.target.closest('[data-cpick]')) coSync();
    });
    ov.querySelector('#coSelClear').onclick=function(){
      Array.prototype.forEach.call(ov.querySelectorAll('[data-cpick]'),
        function(el){el.checked=false});
      coSync();
    };
    ov.querySelector('#coSelDel').onclick=function(){
      var picked=coPicked();
      if(!picked.length)return;
      if(!window.DeleteKit||!window.DeleteKit.confirmMany){
        toast('Delete could not load - refresh the page'); return;
      }
      shut();
      window.DeleteKit.confirmMany({
        entity:'menu_category',
        items:picked,
        cascade:true,
        title:'Delete '+picked.length+' categor'+(picked.length===1?'y':'ies')+'?',
        note:'Purane bill mehfooz rehte hain. Jis category mein items paray hon, wo '
            +'tab tak delete nahi hoti jab tak upar wala option na lagayen.',
        /* ROWS mein har item ke sath us ki category_id aati hai, is liye
           naam se milane ki zaroorat nahi — do categories ka naam ek
           jaisa ho to naam se milana ghalat item uRa deta. */
        itemIdsFor:function(catIds){
          var want={}; catIds.forEach(function(id){want[id]=1});
          return ROWS.filter(function(x){return want[x.category_id]})
                     .map(function(x){return x.id});
        },
        onDone:function(){ SEL={}; load(); }
      });
    };

    /* Delete ka click — dialog ke andar hi. DeleteKit apna popup khud
       dikhati hai aur server ki wajah (agar inkar ho) bhi parhti hai. */
    ov.addEventListener('click',function(e){
      var d=e.target.closest('[data-delcat]'); if(!d)return;
      if(!window.DeleteKit){toast('Delete could not load - refresh the page');return}
      shut();
      window.DeleteKit.confirm({entity:'menu_category',id:d.getAttribute('data-delcat'),
        name:d.getAttribute('data-name')||'',what:'Menu category',
        title:'Delete this category?',
        warning:'Category ke andar koi item hua to server inkar kar dega - pehle un ko doosri category mein le jayein.'});
    });

    function shut(){ ov.remove(); }
    ov.querySelector('#coCancel').onclick=shut;
    ov.addEventListener('click',function(e){ if(e.target===ov) shut(); });
    ov.querySelector('#coSave').onclick=function(){
      var rows=[];
      Array.prototype.forEach.call(ov.querySelectorAll('[data-cid]'),function(el){
        rows.push({id:el.getAttribute('data-cid'),sort_order:Number(el.value||99)});
      });
      this.disabled=true; this.textContent='Saving…';
      var s=req('menu-category-order',{rows:rows});
      if(!s||!s.ok){ this.disabled=false; this.textContent='Save order';
                     toast((s&&s.message)||'Could not save the order'); return; }
      shut();
      toast('Tarteeb mehfooz — Sale Point par Ctrl+Shift+R se nazar aayegi');
      load();
    };
    document.body.appendChild(ov);
  };

  ['mmQ','mmCatF','mmModeF'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener(id==='mmQ'?'input':'change',paint);
  });

  load();
})();
</script>
</body>
</html>
