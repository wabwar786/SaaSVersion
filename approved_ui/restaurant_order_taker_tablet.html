<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e23744">
<title>Order Taker</title>
<style>
/* V72 — screen dobara likhi gayi.
   Pehle bayin taraf icons ka rail tha jis ki order taker ko zaroorat hi
   nahi (wo sirf order leta hai), aur design POS se bilkul alag tha — ek
   hi restaurant ke do screens do alag software lagte the. Ab wahi rang
   aur shakl jo restaurant_pos.html ki hai, aur poora tablet-friendly. */
:root{
  --bg:#f2f6f3;--panel:#fff;--ink:#15221b;--ink2:#5f6f66;--ink3:#8b9a92;
  --l:#e1e9e4;--brand:#e23744;--brandSoft:#fdeef0;
  --ok:#0f7a3d;--warn:#b3541e;--warnbg:#fdf4e9;
  --sh:0 1px 2px rgba(21,34,27,.05),0 6px 18px rgba(21,34,27,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:-apple-system,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,Arial,sans-serif;
  color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.spacer{flex:1}

.app{height:100dvh;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--l);
  background:var(--panel);position:sticky;top:0;z-index:20;padding-top:max(10px,env(safe-area-inset-top))}
.brandmark{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:var(--brand);color:#fff;font-weight:800;font-size:15px}
.top h1{font-size:15px;margin:0;font-weight:800;line-height:1.15}
.top small{display:block;font-size:11px;color:var(--ink2);font-weight:600}
.tb{padding:0 14px;height:40px;border-radius:11px;border:1px solid var(--l);background:var(--panel);
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tb.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.tb.on{background:var(--brandSoft);border-color:var(--brand);color:var(--brand)}
.tb:active{transform:translateY(1px)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 9px}
.dot.off{background:var(--brand)}

.body{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:0;background:var(--panel)}
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 96px}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:1px solid var(--l);border-radius:14px;padding:12px;background:var(--panel);text-align:left;
  box-shadow:var(--sh);min-height:106px;display:flex;flex-direction:column;gap:3px}
.tcard.busy{border-color:var(--brand);background:var(--brandSoft)}
.tcard b{font-size:15px}
.tcard small{font-size:11px;color:var(--ink2)}
.tcard .amt{font-size:19px;font-weight:800;margin-top:auto}
.tcard .pill{align-self:flex-start;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;
  background:var(--warnbg);color:var(--warn)}

.cats{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid var(--l);
  -webkit-overflow-scrolling:touch}
.cats button{padding:0 14px;height:38px;border-radius:99px;border:1px solid var(--l);
  font-size:13px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.cats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pcard{border:1px solid var(--l);border-radius:14px;padding:11px;text-align:left;background:var(--panel);
  min-height:88px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.pcard:active{border-color:var(--brand);background:var(--brandSoft)}
.pcard b{font-size:13.5px;line-height:1.25}
.pcard .rate{margin-top:auto;font-size:15px;font-weight:800;color:var(--brand)}

.cart{border-left:1px solid var(--l);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.cart-head{padding:12px 14px;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:8px}
.cart-head b{font-size:14px}
.lines{flex:1;overflow:auto;padding:8px 10px;-webkit-overflow-scrolling:touch}
.line{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:9px;
  border:1px solid var(--l);border-radius:12px;margin-bottom:7px}
.line b{font-size:13.5px}
.line small{font-size:11px;color:var(--ink2)}
.line .sent{color:var(--ok);font-weight:700}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--l);font-size:17px;font-weight:800}
.qty span{min-width:26px;text-align:center;font-weight:800}
.pay{display:flex;gap:8px;padding:10px 14px 0}
.pay button{flex:1;height:42px;border-radius:11px;border:1px solid var(--l);font-size:13px;font-weight:700}
.pay button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.totals{padding:10px 14px;border-top:1px solid var(--l);font-size:13px}
.trow{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink2)}
.trow.big{font-size:19px;font-weight:800;color:var(--ink);padding-top:8px;margin-top:6px;
  border-top:1px dashed var(--l)}
.acts{display:flex;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.acts .tb{flex:1;height:48px;justify-content:center;font-size:14px}

.cartbar{display:none}
@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .cart{position:fixed;inset:auto 0 0 0;height:74vh;border-left:0;border-top:1px solid var(--l);
    border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .25s ease;z-index:40;
    box-shadow:0 -12px 40px rgba(21,34,27,.18)}
  .cart.open{transform:none}
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;gap:10px;align-items:center;
    padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--l)}
}

.empty{padding:40px 18px;text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:200;
  transition:.2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--brand)}
#offline{position:fixed;inset:0;z-index:300;background:rgba(21,34,27,.94);color:#fff;display:none;
  place-items:center;text-align:center;padding:28px}
#offline.show{display:grid}
#offline h2{font-size:19px;margin:0 0 8px}
#offline p{font-size:13.5px;opacity:.85;line-height:1.6;margin:0 0 6px;max-width:380px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brandmark" id="mark">R</div>
    <div><h1 id="ttl">Hold Bills</h1><small id="sub">Pick a table to start</small></div>
    <div class="spacer"></div>
    <button class="tb hide" id="backBtn">&#8592; Tables</button>
    <button class="tb on" id="holdBtn">Hold Bills</button>
    <span class="dot" id="conn" title="Connected"></span>
  </header>

  <div class="body">
    <div class="main">
      <div class="cats hide" id="cats"></div>
      <div class="scroll" id="stage"><div class="empty">Loading...</div></div>
    </div>
    <aside class="cart" id="cart">
      <div class="cart-head"><b id="cartTitle">No table</b><div class="spacer"></div>
        <button class="tb hide" id="cartClose">Close</button></div>
      <div class="lines" id="lines"><div class="empty">No items yet.</div></div>
      <div class="pay">
        <button id="payCash" class="on">Cash</button>
        <button id="payCard">Card / Online</button>
      </div>
      <div class="totals" id="totals"></div>
      <div class="acts">
        <button class="tb" id="holdSave">Hold</button>
        <button class="tb primary" id="sendKot">Send to Kitchen</button>
      </div>
    </aside>
  </div>

  <div class="cartbar" id="cartbar">
    <div><small style="color:var(--ink2);font-size:11px">Bill total</small>
      <div style="font-size:19px;font-weight:800" id="barTotal">0</div></div>
    <div class="spacer"></div>
    <button class="tb primary" id="openCart" style="height:46px">View bill</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="offline"><div><h2 id="offTitle">POS computer is not reachable</h2>
  <p id="offMsg">This tablet works only while the POS computer is switched on and connected to the same WiFi.</p>
  <p style="opacity:.6;font-size:12px" id="offWhen"></p></div></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0})}
function toast(m,err){var t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');
  clearTimeout(window.__t);window.__t=setTimeout(function(){t.className='toast'},2600)}
function req(a,p){try{return window.DBApi?DBApi.req(a,p):{ok:false,message:'No server connection'}}
  catch(e){return {ok:false,message:e.message||'Request failed'}}}

var MENU=[],CATS=[],TABLES=[],TAX={tax_cash:16,tax_card:8,service_charge:0};
var view='tables',table=null,cart=[],payMode='cash';

function boot(){
  var b=req('pos-boot');
  if(!b||!b.ok){$('#stage').innerHTML='<div class="empty">'+esc((b&&b.message)||'Could not load the menu')+'</div>';return}
  var bb=b.boot||{};
  MENU=(bb.products||[]).map(function(x){
    return {id:x.id,name:x.name,price:Number(x.price||0),cat:x.cat||'General'};
  });
  CATS=[];MENU.forEach(function(m){if(CATS.indexOf(m.cat)<0)CATS.push(m.cat)});
  if(bb.brand&&bb.brand.name)$('#mark').textContent=(bb.brand.name[0]||'R').toUpperCase();
  loadTables();
}

function loadTables(){
  var r=req('tablet-tables');
  if(!r||!r.ok){$('#stage').innerHTML='<div class="empty">'+esc((r&&r.message)||'Could not load tables')+'</div>';return}
  TABLES=r.tables||[];if(r.tax)TAX=r.tax;
  if(view==='tables')drawTables();
}

function drawTables(){
  view='tables';table=null;cart=[];
  $('#ttl').textContent='Hold Bills';
  $('#sub').textContent=TABLES.filter(function(t){return t.busy}).length+' table(s) with an open bill';
  $('#cats').classList.add('hide');
  $('#backBtn').classList.add('hide');
  $('#holdBtn').classList.add('on');
  $('#cartbar').style.display='';
  $('#cart').classList.remove('open');
  renderCart();
  if(!TABLES.length){
    $('#stage').innerHTML='<div class="empty">No dining tables yet.<br>Add tables from <b>Tables &amp; Floors</b> on the POS.</div>';return}
  $('#stage').innerHTML='<div class="tgrid">'+TABLES.map(function(t){
    return '<button class="tcard'+(t.busy?' busy':'')+'" data-tbl="'+esc(t.id)+'">'
      +(t.unsent>0?'<span class="pill">'+t.unsent+' not sent</span>':'')
      +'<b>'+esc(t.name)+'</b><small>'+esc(t.floor)
      +(t.busy?(' &middot; '+t.items+' item &middot; '+t.mins+'m'):' &middot; free')+'</small>'
      +'<div class="amt">'+(t.busy?money(t.running):'&mdash;')+'</div></button>';
  }).join('')+'</div>';
}

function openTable(id){
  table=TABLES.filter(function(t){return t.id===id})[0];if(!table)return;
  view='menu';
  $('#ttl').textContent=table.name;
  $('#sub').textContent=table.floor+(table.bill?(' \u00b7 Bill '+table.bill):' \u00b7 new bill');
  $('#backBtn').classList.remove('hide');
  $('#holdBtn').classList.remove('on');
  cart=[];
  /* Poora bill dikhta hai, sirf apni entries nahi — koi bhi order taker
     kisi bhi table par kaam kar sakta hai, aur customer poora total
     poochta hai. */
  var o=req('tablet-order&table='+encodeURIComponent(id));
  if(o&&o.ok&&o.items)o.items.forEach(function(i){
    cart.push({id:i.menu_id,name:i.name,price:i.price,qty:i.qty,sent:i.sent});});
  drawCats();drawMenu(CATS[0]||'');renderCart();
}

function drawCats(){
  var c=$('#cats');c.classList.remove('hide');
  c.innerHTML=CATS.map(function(x,i){
    return '<button data-cat="'+esc(x)+'"'+(i===0?' class="on"':'')+'>'+esc(x)+'</button>'}).join('');
}
function drawMenu(cat){
  var list=MENU.filter(function(m){return !cat||m.cat===cat});
  $('#stage').innerHTML=list.length?'<div class="pgrid">'+list.map(function(m){
    return '<button class="pcard" data-item="'+esc(m.id)+'"><b>'+esc(m.name)+'</b>'
      +'<div class="rate">'+money(m.price)+'</div></button>'}).join('')+'</div>'
    :'<div class="empty">No items in this category.</div>';
}

function add(id){
  var m=MENU.filter(function(x){return x.id===id})[0];if(!m)return;
  var l=cart.filter(function(x){return x.id===id})[0];
  if(l)l.qty++;else cart.push({id:m.id,name:m.name,price:m.price,qty:1,sent:0});
  renderCart();
}
function totals(){
  var sub=cart.reduce(function(a,x){return a+x.price*x.qty},0);
  var rate=payMode==='card'?Number(TAX.tax_card||0):Number(TAX.tax_cash||0);
  var svc=sub*Number(TAX.service_charge||0)/100;
  var tax=(sub+svc)*rate/100;
  return {sub:sub,svc:svc,tax:tax,rate:rate,grand:sub+svc+tax};
}
function renderCart(){
  $('#cartTitle').textContent=table?table.name:'No table';
  var t=totals();
  $('#barTotal').textContent=money(t.grand);
  $('#lines').innerHTML=cart.length?cart.map(function(l,i){
    return '<div class="line"><div><b>'+esc(l.name)+'</b><br><small>'+money(l.price)+' each'
      +(l.sent>0?' &middot; <span class="sent">'+l.sent+' sent</span>':'')+'</small></div>'
      +'<div class="qty"><button data-dec="'+i+'">&minus;</button><span>'+l.qty+'</span>'
      +'<button data-inc="'+i+'">+</button></div></div>'}).join('')
    :'<div class="empty">No items yet.<br>Tap items to add them.</div>';
  $('#totals').innerHTML='<div class="trow"><span>Subtotal</span><b>'+money(t.sub)+'</b></div>'
    +(t.svc>0?'<div class="trow"><span>Service charge</span><b>'+money(t.svc)+'</b></div>':'')
    +'<div class="trow"><span>Tax '+esc(String(t.rate))+'% ('+(payMode==='card'?'card':'cash')+')</span><b>'+money(t.tax)+'</b></div>'
    +'<div class="trow big"><span>Total</span><span>'+money(t.grand)+'</span></div>';
}

function payload(){
  return {table_id:table?table.id:'',service_mode:'DINE_IN',bill_no:(table&&table.bill)||'',
          items:cart.map(function(l){return {menu_item_id:l.id,name:l.name,qty:l.qty,unit_price:l.price}})};
}
function hold(){
  if(!table){toast('Pick a table first',true);return}
  if(!cart.length){toast('Add items first',true);return}
  var r=req('pos-hold',payload());
  if(!r||!r.ok){toast((r&&r.message)||'Could not hold the bill',true);return}
  toast('Held on '+table.name);loadTables();drawTables();
}
function send(){
  if(!table){toast('Pick a table first',true);return}
  if(!cart.filter(function(l){return l.qty>(l.sent||0)}).length){toast('Nothing new to send',true);return}
  var r=req('pos-kot',payload());
  if(!r||!r.ok){toast((r&&r.message)||'Could not send to the kitchen',true);return}
  toast('Sent to kitchen');
  cart.forEach(function(l){l.sent=l.qty});renderCart();loadTables();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tbl]');if(t){openTable(t.getAttribute('data-tbl'));return}
  var c=e.target.closest('[data-cat]');if(c){
    Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'),function(b){b.classList.remove('on')});
    c.classList.add('on');drawMenu(c.getAttribute('data-cat'));return}
  var i=e.target.closest('[data-item]');if(i){add(i.getAttribute('data-item'));return}
  var inc=e.target.closest('[data-inc]');if(inc){cart[+inc.getAttribute('data-inc')].qty++;renderCart();return}
  var dec=e.target.closest('[data-dec]');if(dec){
    var k=+dec.getAttribute('data-dec'),l=cart[k];
    /* Kitchen ko bheji hui qty wapas nahi ho sakti — kitchen bana chuki
       hoti hai. Us ke liye POS par Void chahiye. */
    if(l.qty-1<(l.sent||0)){toast('Already sent to the kitchen. Use Void on the POS.',true);return}
    l.qty--;if(l.qty<=0)cart.splice(k,1);renderCart();return}
});
$('#backBtn').onclick=function(){loadTables();drawTables()};
$('#holdBtn').onclick=function(){loadTables();drawTables()};
$('#holdSave').onclick=hold;
$('#sendKot').onclick=send;
$('#payCash').onclick=function(){payMode='cash';this.classList.add('on');$('#payCard').classList.remove('on');renderCart()};
$('#payCard').onclick=function(){payMode='card';this.classList.add('on');$('#payCash').classList.remove('on');renderCart()};
$('#openCart').onclick=function(){$('#cart').classList.add('open');$('#cartClose').classList.remove('hide')};
$('#cartClose').onclick=function(){$('#cart').classList.remove('open')};

(function(){
  var missed=0;
  function ping(){
    var x=new XMLHttpRequest();
    x.open('GET','/api.php?action=current-user',true);x.timeout=6000;
    x.onload=function(){
      if(x.status>=200&&x.status<400){missed=0;$('#offline').classList.remove('show');$('#conn').className='dot';return}
      if(x.status===401||x.status===403){
        $('#offTitle').textContent='This tablet needs to be connected again';
        $('#offMsg').textContent='Ask the counter to open the POS and tap "Connect a tablet", then scan the code.';
        $('#offline').classList.add('show');return}
      fail()};
    x.onerror=x.ontimeout=fail;
    try{x.send()}catch(e){fail()}
  }
  function fail(){
    missed++;$('#conn').className='dot off';
    /* Ek dafa fail hone par nahi — WiFi ka lamhati jhatka aam hai. */
    if(missed>=2){$('#offWhen').textContent='Last checked '+new Date().toLocaleTimeString();
      $('#offline').classList.add('show')}
  }
  ping();setInterval(ping,15000);window.addEventListener('online',ping);
})();

setInterval(function(){if(view==='tables')loadTables()},20000);
boot();
})();
</script>
</body>
</html>
