<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Point of Sale · Urban Spoon</title>
<style>
:root{
  --bg:#f2f6f3;--panel:#fff;--ink:#15221b;--ink2:#5f6f66;--line:#e1e9e4;
  --brand:#e23744;--brand2:#ff5864;--ok:#0f7a3d;--ok-bg:#eaf6ef;--warn:#b3541e;
  --shadow:0 1px 2px rgba(21,34,27,.05),0 8px 24px rgba(21,34,27,.06);
  --shadow-lg:0 4px 12px rgba(21,34,27,.08),0 20px 44px rgba(21,34,27,.12);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.pos{display:grid;grid-template-columns:1fr 420px;grid-template-rows:auto auto 1fr;height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.strip{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:7px 16px;background:linear-gradient(90deg,#f6fbf8,#fff);border-bottom:1px solid var(--line);font-size:12px;overflow-x:auto;white-space:nowrap}
.left{overflow:auto;padding:14px 16px}
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brandmark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{flex:1;border:0;background:none;outline:none}
.tbtn{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:700;transition:.14s;white-space:nowrap}
.tbtn:hover{border-color:var(--brand);color:var(--brand)}
.tbtn.pri{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(226,55,68,.28)}
.tbtn.pri:hover{color:#fff;filter:brightness(1.05)}
.who{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px}
.av{width:28px;height:28px;border-radius:99px;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-weight:800;font-size:11px}
.who small{display:block;font-size:10px;color:var(--ink2)}
.who strong{display:block;font-size:12px}
.sb{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;flex:none}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.dot.g{background:var(--ok)}.dot.r{background:var(--brand)}
.strip a{color:var(--ok);font-weight:800;text-decoration:none;margin-left:4px}
.strip a.danger{color:var(--brand)}
.ver{margin-left:auto;font-size:10px;color:#9aa8a0;font-weight:800;letter-spacing:.5px;flex:none}
.secttl{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--ink2);text-transform:uppercase;margin:2px 0 9px}
.cats{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.cat{padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:700;transition:.14s;box-shadow:var(--shadow)}
.cat:hover{transform:translateY(-2px)}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-lg)}
.cat span{opacity:.6;font-weight:600;margin-left:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:13px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column}
.prod:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#cfe0d6}
.thumb{height:104px;background:linear-gradient(135deg,#eef5f0,#e3eee8);position:relative;cursor:pointer;display:grid;place-items:center;font-size:30px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:7px;right:7px;background:rgba(21,34,27,.82);color:#fff;font-size:9px;font-weight:800;padding:3px 8px;border-radius:999px}
.pbody{padding:10px 11px 11px;display:flex;flex-direction:column;gap:7px;flex:1}
.pbody h4{font-size:12.5px;font-weight:700;line-height:1.25}
.pbody p{font-size:10.5px;color:var(--ink2);line-height:1.3;flex:1}
.pf{display:flex;align-items:center;gap:7px}
.price{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:4px 10px;font-weight:800;font-size:11.5px;white-space:nowrap}
.qbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.qbox button{width:22px;height:24px;font-weight:800;color:var(--ink2)}
.qbox button:hover{background:var(--bg);color:var(--brand)}
.qbox span{min-width:20px;text-align:center;font-weight:800;font-size:11px}
.addb{width:100%;padding:8px;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:11.5px;box-shadow:0 3px 9px rgba(226,55,68,.24);transition:.14s}
.addb:hover{filter:brightness(1.06)}
.empty{grid-column:1/-1;padding:46px 20px;text-align:center;border:1.5px dashed #cfdcd4;border-radius:var(--r);background:var(--panel)}
.empty .ic{font-size:36px;margin-bottom:10px}
.empty h3{font-size:15px;margin-bottom:5px}
.empty p{font-size:12px;color:var(--ink2);margin-bottom:16px}
.rhead{padding:12px 15px;border-bottom:1px solid var(--line)}
.rhead .r1{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rhead h2{font-size:15px;font-weight:800}
.rhead .sub{font-size:10.5px;color:var(--ink2)}
.modes{display:flex;gap:6px;margin-bottom:9px}
.mode{flex:1;padding:7px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:11.5px;transition:.14s}
.mode.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowsel{display:flex;gap:7px}
.rowsel select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);outline:none;min-width:0}
.items{flex:1;overflow:auto}
.ci{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:10px 15px;border-bottom:1px solid var(--line)}
.ci .cq{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ci .cq button{width:21px;height:23px;font-weight:800;color:var(--ink2)}
.ci .cq button:hover{background:var(--bg);color:var(--brand)}
.ci .cq span{min-width:26px;text-align:center;font-weight:800;font-size:11px}
.ci b{font-size:12.5px;font-weight:700;display:block}
.ci small{font-size:10px;color:var(--ink2)}
.ci .amt{text-align:right;font-weight:800;font-size:12.5px;white-space:nowrap}
.ci .x{color:#c7d2cb;font-size:15px;line-height:1;float:right}
.ci .x:hover{color:var(--brand)}
.sent{color:var(--ok);font-weight:700}
.cempty{padding:52px 20px;text-align:center;color:var(--ink2);font-size:12px}
.tot{border-top:1px solid var(--line);padding:11px 15px;background:#fbfdfc}
.tr{display:flex;justify-content:space-between;padding:3.5px 0;font-size:12px}
.tr .lbl{color:var(--ink2);display:flex;align-items:center;gap:6px}
.ed{font-size:9.5px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-weight:700;color:var(--ink2)}
.ed:hover{color:var(--brand);border-color:var(--brand)}
.grand{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:11px 13px;background:var(--ink);color:#fff;border-radius:11px}
.grand b{font-size:17px;font-weight:800}
.acts{display:flex;gap:8px;padding:11px 15px;border-top:1px solid var(--line)}
.acts button{flex:1;padding:13px;border-radius:11px;font-weight:800;font-size:12.5px;transition:.14s}
.kot{background:#f5a623;color:#fff;box-shadow:0 4px 12px rgba(245,166,35,.3)}
.chg{background:var(--ok);color:#fff;flex:1.5;box-shadow:0 4px 12px rgba(15,122,61,.28)}
.acts button:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.acts button:not(:disabled):hover{filter:brightness(1.07)}
.ov{position:fixed;inset:0;background:rgba(10,24,17,.55);backdrop-filter:blur(3px);z-index:900;display:flex;align-items:center;justify-content:center;padding:18px}
.dlg{background:var(--panel);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);width:100%;max-width:440px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{max-width:640px}
.dh{padding:17px 20px 13px;border-bottom:1px solid var(--line)}
.dh h3{font-size:15.5px;font-weight:800}
.dh p{font-size:11.5px;color:var(--ink2);margin-top:2px}
.db{padding:17px 20px;overflow:auto;flex:1}
.df{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px}
.df button{flex:1;padding:12px;border-radius:11px;font-weight:800;transition:.14s}
.df .sec{border:1px solid var(--line);background:var(--panel)}
.df .go{background:var(--brand);color:#fff;flex:1.6;box-shadow:0 4px 12px rgba(226,55,68,.26)}
.df button:hover{filter:brightness(1.05)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg .full{grid-column:1/-1}
label.f{display:block;font-size:10.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none;transition:.14s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(226,55,68,.1)}
.tabs{display:flex;gap:6px;padding:0 20px 13px}
.tab{flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:11.5px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv span{color:var(--ink2)}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:12px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}
.pm button{padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:11.5px}
.pm button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.hold{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px}
.hold b{font-size:12.5px}.hold small{display:block;font-size:10.5px;color:var(--ink2);margin-top:2px}
.hold button{padding:7px 14px;background:var(--ok-bg);color:var(--ok);border-radius:9px;font-weight:800;font-size:11.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:990;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1080px){.pos{grid-template-columns:1fr 350px}}
</style>
</head>
<body>
<div class="pos">
  <header class="top">
    <div class="brandmark">U</div>
    <div class="search"><span>&#128269;</span><input id="q" placeholder="Search item name or category..."></div>
    <div style="flex:1"></div>
    <button class="tbtn" id="holdsBtn">Hold Bills <b id="holdCount">(0)</b></button>
    <button class="tbtn" id="manageBtn">Manage Items</button>
    <button class="tbtn pri" id="newItemBtn">+ New Item</button>
    <div class="who"><div class="av" id="avIni">..</div><div><small id="whoRole">Cashier</small><strong id="whoName">--</strong></div></div>
  </header>

  <div class="strip" id="strip"></div>

  <main class="left">
    <div class="secttl">Categories</div>
    <div class="cats" id="cats"></div>
    <div class="secttl" id="gridTitle">Menu Items</div>
    <div class="grid" id="grid"></div>
  </main>

  <aside class="right">
    <div class="rhead">
      <div class="r1">
        <div style="flex:1"><h2 id="billTitle">Bill #0001</h2><div class="sub" id="billSub">New order</div></div>
        <button class="tbtn" id="newBillBtn">+ New Bill</button>
      </div>
      <div class="modes">
        <button class="mode on" data-mode="Dine In">Dine In</button>
        <button class="mode" data-mode="Takeaway">Takeaway</button>
        <button class="mode" data-mode="Home Delivery">Delivery</button>
      </div>
      <div class="rowsel">
        <select id="tableSel"><option value="">Select Table</option></select>
        <select id="custSel"><option value="walkin">Walk-in Customer</option></select>
      </div>
    </div>
    <div class="items" id="cart"></div>
    <div class="tot">
      <div class="tr"><span class="lbl">Subtotal</span><span id="tSub">PKR 0</span></div>
      <div class="tr"><span class="lbl">Discount <button class="ed" id="edDisc">Edit</button></span><span id="tDisc">- PKR 0</span></div>
      <div class="tr"><span class="lbl">Service Charge <button class="ed" id="edSvc">Edit</button></span><span id="tSvc">PKR 0</span></div>
      <div class="tr"><span class="lbl">Sales Tax <button class="ed" id="edTax">Edit</button></span><span id="tTax">PKR 0</span></div>
      <div class="grand"><span>Grand Total</span><b id="tGrand">PKR 0</b></div>
    </div>
    <div class="acts">
      <button class="kot" id="kotBtn" disabled>Send to Kitchen</button>
      <button class="chg" id="chargeBtn" disabled>Charge</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   POS v20 — 100% DB-driven. Koi demo data nahi.
   Data: pos-boot / pos-kot / pos-finalize / pos-quick-item /
         menu-category-create / menu-item-rate / shift-* / records-*
   ========================================================= */
'use strict';
var VERSION='POS v20.1';
var $=function(s){return document.querySelector(s)};
var CSRF=window.APP_CSRF||'';

function api(action,payload){
  try{
    var x=new XMLHttpRequest();
    x.open(payload?'POST':'GET','/api.php?action='+action,false);
    x.setRequestHeader('Accept','application/json');
    if(payload){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('X-CSRF-Token',CSRF);}
    x.send(payload?JSON.stringify(payload):null);
    var r=JSON.parse(x.responseText||'{}');
    if(!r.ok&&r.message)console.warn(action,r.message);
    return r;
  }catch(e){return {ok:false,message:(e&&e.message)||'Server unreachable'}}
}
function money(n){return 'PKR '+Math.round(Number(n)||0).toLocaleString()}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.className='toast on';clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast'},2600)}

var BOOT={products:[],categories:[],customers:[],tables:[],printers:{}};
var cart=[], cat='All', search='', mode='Dine In', preQty={};
var billNo='0001', shift=null, orderTax=0, orderSvc=0, disc={type:'flat',value:0};
var HOLD_MODULE='held_bills', holds=[];

function banner(html){
  var b=document.getElementById('errBar');
  if(!b){b=document.createElement('div');b.id='errBar';
    b.style.cssText='grid-column:1/-1;padding:11px 16px;background:#fdecec;border-bottom:1px solid #f5c2c2;color:#8c1d24;font-size:12.5px;font-weight:600;display:flex;gap:12px;align-items:center;flex-wrap:wrap';
    var st=document.getElementById('strip');st.parentNode.insertBefore(b,st.nextSibling);}
  b.innerHTML=html;
  var d=document.getElementById('diagBtn');
  if(d)d.onclick=showDiagnostics;
}
function boot(){
  var r;
  try{ r=api('pos-boot'); }
  catch(e){ r={ok:false,message:'JS error: '+(e&&e.message)}; }
  if(!r||!r.ok){
    renderAll();
    banner('<span>&#9888; Menu load nahi hua &mdash; server ne kaha: <b>'+esc((r&&r.message)||'no response')+'</b></span>'
      +'<button class="tbtn" id="diagBtn" style="padding:5px 12px">Run Diagnostics</button>');
    return;
  }
  var eb=document.getElementById('errBar'); if(eb)eb.remove();
  BOOT=r.boot;
  billNo=String(BOOT.nextBill||1).padStart(4,'0');
  shift=BOOT.shift||null;
  if(BOOT.cashier){
    $('#whoName').textContent=BOOT.cashier.name;
    $('#whoRole').textContent=BOOT.cashier.role;
    $('#avIni').textContent=BOOT.cashier.name.split(/\s+/).map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase();
  }
  $('#tableSel').innerHTML='<option value="">Select Table</option>'+
    (BOOT.tables||[]).map(function(t){var n=esc(t.display_name||t.name);return '<option>'+n+'</option>'}).join('');
  $('#custSel').innerHTML=(BOOT.customers||[]).map(function(c){
    return '<option value="'+esc(c.id)+'">'+esc(c.name)+(c.phone?' - '+esc(c.phone):'')+'</option>';
  }).join('');
  loadHolds();
  renderAll();
  if(!shift)openGate();
}
function renderAll(){renderStrip();renderCats();renderGrid();renderCart()}

function showDiagnostics(){
  var r=api('pos-diagnostics');
  if(!r.ok){toast(r.message||'Diagnostics failed');return}
  var d=r.diag;
  function row(k,v,bad){return '<div class="kv"><span>'+esc(k)+'</span><b style="'+(bad?'color:var(--brand)':'')+'">'+esc(v)+'</b></div>'}
  var h='';
  h+=row('Branch (site)',d.site_name,String(d.site_name).indexOf('missing')>=0);
  h+=row('Menu items in THIS branch',d.menu_items_this_site,d.menu_items_this_site===0);
  h+=row('POS-visible (active + is_pos)',d.menu_items_pos_visible,d.menu_items_pos_visible===0);
  h+=row('Items in OTHER branches',d.menu_items_other_sites,d.menu_items_other_sites>0);
  h+=row('Items with broken category',d.menu_items_no_category,d.menu_items_no_category>0);
  h+=row('Stranded in ui_records',d.stranded_ui_records_menu,d.stranded_ui_records_menu>0);
  h+=row('Categories',d.categories,d.categories===0);
  h+=row('Payment methods',d.payment_methods,d.payment_methods===0);
  h+=row('Stock locations',d.stock_locations,d.stock_locations===0);
  h+=row('Tables',d.tables,d.tables===0);
  h+=row('Units (global)',d.units_global,d.units_global===0);
  h+=row('Branches in business',d.sites_in_tenant);
  h+=row('posBoot returns',d.posBoot_products===null?'ERROR':d.posBoot_products+' products',!d.posBoot_products);
  if(d.posBoot_error)h+=row('posBoot error',d.posBoot_error,true);
  var items=(d.recent_items||[]).map(function(x){
    return '<div style="font-size:11.5px;padding:6px 0;border-bottom:1px dashed var(--line)"><b>'+esc(x.name)+'</b> &mdash; PKR '+esc(x.base_price)
      +' &middot; '+esc(x.cat)+' &middot; active:'+x.is_active+' pos:'+x.is_pos
      +(x.site_id!==d.site_id?' <span style="color:var(--brand)">(doosri branch!)</span>':'')+'</div>';
  }).join('')||'<div class="cempty">Is business mein koi menu item nahi</div>';
  var tip='';
  if(d.menu_items_pos_visible===0&&d.stranded_ui_records_menu>0)tip='Items purane format (ui_records) mein phansay hain — service redeploy/restart karein, boot migration inhe theek kar degi.';
  else if(d.menu_items_pos_visible===0&&d.menu_items_other_sites>0)tip='Items doosri branch (site) mein bane hain. Isi branch se item banayein, ya branch switch karein.';
  else if(d.menu_items_pos_visible===0)tip='Is branch mein koi POS-visible item nahi — "+ New Item" se banayein.';
  modal('<div class="dh"><h3>POS Diagnostics</h3><p>Ye seedhe database se aa raha hai</p></div>'
    +'<div class="db">'+h
    +(tip?'<div class="box" style="border-color:#f0c98a;background:#fdf6e9"><b>Kya karein:</b> '+esc(tip)+'</div>':'')
    +'<div class="box"><b style="font-size:11.5px">Recent menu items (poore business ke)</b><div style="margin-top:7px">'+items+'</div></div></div>'
    +'<div class="df"><button class="sec" data-x>Close</button><button class="go" id="cpy">Copy Report</button></div>',true);
  document.getElementById('cpy').onclick=function(){
    var t=JSON.stringify(d,null,2);
    if(navigator.clipboard)navigator.clipboard.writeText(t);
    toast('Report copy ho gayi — support ko bhej dein');
  };
}

function renderStrip(){
  var n=BOOT.products.length;
  $('#strip').innerHTML=
    '<span class="sb">&#127978; '+esc((BOOT.site&&BOOT.site.name)||'Branch')+'</span>'
    +(shift
      ?'<span class="sb"><span class="dot g"></span>Shift '+esc(shift.shift_no)+'<a href="#" class="danger" id="sClose">Close</a></span>'
      :'<span class="sb"><span class="dot r"></span>Shift closed<a href="#" id="sOpen">Open</a></span>')
    +'<span class="sb">&#127869; '+n+' menu item'+(n===1?'':'s')+'</span>'
    +'<span class="sb">&#129534; Bill #'+billNo+'</span>'

function catCount(name){return BOOT.products.filter(function(p){return p.cat===name}).length}
function renderCats(){
  var html='<button class="cat'+(cat==='All'?' on':'')+'" data-cat="All">All Items<span>'+BOOT.products.length+'</span></button>';
  html+=(BOOT.categories||[]).map(function(c){
    return '<button class="cat'+(cat===c.name?' on':'')+'" data-cat="'+esc(c.name)+'">'+esc(c.icon||'')+' '+esc(c.name)+'<span>'+catCount(c.name)+'</span></button>';
  }).join('');
  $('#cats').innerHTML=html;
  Array.prototype.forEach.call($('#cats').querySelectorAll('[data-cat]'),function(b){
    b.onclick=function(){cat=this.dataset.cat;renderCats();renderGrid()};
  });
}
function visible(){
  var s=search.trim().toLowerCase();
  return BOOT.products.filter(function(p){
    if(cat!=='All'&&p.cat!==cat)return false;
    if(!s)return true;
    return (p.name+' '+p.cat+' '+(p.desc||'')).toLowerCase().indexOf(s)>=0;
  });
}
function renderGrid(){
  var list=visible(), g=$('#grid');
  $('#gridTitle').textContent=cat==='All'?'Menu Items':cat;
  if(!BOOT.products.length){
    g.innerHTML='<div class="empty"><div class="ic">&#127869;</div><h3>Menu abhi khali hai</h3>'
      +'<p>Apna pehla item banayein - POS grid, Order Taker aur Menu page teeno par foran aa jayega.</p>'
      +'<button class="addb" style="max-width:240px;margin:0 auto;padding:11px" id="firstItem">+ Create First Item</button>'
      +'<div style="margin-top:13px"><button class="tbtn" id="diagBtn2" style="padding:7px 16px">Items banaye hain magar dikh nahi rahe? Run Diagnostics</button></div></div>';
    $('#firstItem').onclick=function(){openItemModal('item')};
    $('#diagBtn2').onclick=showDiagnostics;
    return;
  }
  if(!list.length){g.innerHTML='<div class="empty"><div class="ic">&#128269;</div><h3>Koi item nahi mila</h3><p>Doosra naam ya category try karein.</p></div>';return}
  g.innerHTML=list.map(function(p){
    var q=preQty[p.id]||1;
    var pr=p.weighted?money(p.price)+' / KG':(p.pizza?'From '+money(p.price):money(p.price));
    return '<div class="prod">'
      +'<div class="thumb" data-add="'+esc(p.id)+'" title="Click to add">'
      +(p.img?'<img src="'+esc(p.img)+'" alt="" onerror="this.remove()">':'')
      +(p.weighted?'<span class="badge">Weighted</span>':(p.pizza?'<span class="badge">Options</span>':''))+'</div>'
      +'<div class="pbody"><h4>'+esc(p.name)+'</h4><p>'+esc(p.desc||p.cat)+'</p>'
      +'<div class="pf"><span class="price">'+pr+'</span>'
      +'<div class="qbox"><button data-dec="'+esc(p.id)+'">-</button><span>'+q+'</span><button data-inc="'+esc(p.id)+'">+</button></div></div>'
      +'<button class="addb" data-add="'+esc(p.id)+'">Add</button></div></div>';
  }).join('');
  Array.prototype.forEach.call(g.querySelectorAll('[data-add]'),function(b){b.onclick=function(){addItem(this.dataset.add)}});
  Array.prototype.forEach.call(g.querySelectorAll('[data-inc]'),function(b){b.onclick=function(e){e.stopPropagation();var i=this.dataset.inc;preQty[i]=(preQty[i]||1)+1;renderGrid()}});
  Array.prototype.forEach.call(g.querySelectorAll('[data-dec]'),function(b){b.onclick=function(e){e.stopPropagation();var i=this.dataset.dec;preQty[i]=Math.max(1,(preQty[i]||1)-1);renderGrid()}});
}

function addItem(id){
  var p=BOOT.products.find(function(x){return x.id===id});
  if(!p)return;
  var q=preQty[id]||1;
  if(p.weighted){
    var w=prompt('Weight in KG for '+p.name+':','1');
    if(w===null)return; q=Number(w)||0; if(q<=0){toast('Valid weight enter karein');return}
  }
  var line=cart.find(function(l){return l.id===id});
  if(line)line.qty+=q; else cart.push({id:id,name:p.name,qty:q,price:p.price,sentQty:0,note:''});
  preQty[id]=1;renderGrid();renderCart();
}
function totals(){
  var sub=cart.reduce(function(a,l){return a+l.qty*l.price},0);
  var d=disc.type==='percent'?sub*disc.value/100:disc.value;
  d=Math.min(d,sub);
  var base=sub-d, svc=base*orderSvc/100, tax=(base+svc)*orderTax/100;
  return {sub:sub,disc:d,svc:svc,tax:tax,grand:base+svc+tax};
}
function renderCart(){
  var c=$('#cart');
  if(!cart.length)c.innerHTML='<div class="cempty">Cart khali hai - item par click karke add karein</div>';
  else c.innerHTML=cart.map(function(l,i){
    return '<div class="ci">'
      +'<div class="cq"><button data-cd="'+i+'">-</button><span>'+(l.qty%1?l.qty.toFixed(3):l.qty)+'</span><button data-cu="'+i+'">+</button></div>'
      +'<div><b>'+esc(l.name)+'</b><small>'+money(l.price)+' each'+(l.sentQty>0?' &middot; <span class="sent">Kitchen sent: '+l.sentQty+'</span>':'')+'</small></div>'
      +'<div><button class="x" data-cx="'+i+'">&times;</button><div class="amt">'+money(l.qty*l.price)+'</div></div></div>';
  }).join('');
  Array.prototype.forEach.call(c.querySelectorAll('[data-cu]'),function(b){b.onclick=function(){cart[this.dataset.cu].qty++;renderCart()}});
  Array.prototype.forEach.call(c.querySelectorAll('[data-cd]'),function(b){b.onclick=function(){var i=this.dataset.cd,l=cart[i];l.qty--;if(l.qty<=0)cart.splice(i,1);renderCart()}});
  Array.prototype.forEach.call(c.querySelectorAll('[data-cx]'),function(b){b.onclick=function(){
    var i=this.dataset.cx,l=cart[i];
    if(l.sentQty>0&&!confirm('Yeh item kitchen ja chuka hai. Remove karein?'))return;
    cart.splice(i,1);renderCart();
  }});
  var t=totals();
  $('#tSub').textContent=money(t.sub);
  $('#tDisc').textContent='- '+money(t.disc);
  $('#tSvc').textContent=money(t.svc)+(orderSvc?' ('+orderSvc+'%)':'');
  $('#tTax').textContent=money(t.tax)+(orderTax?' ('+orderTax+'%)':'');
  $('#tGrand').textContent=money(t.grand);
  $('#billTitle').textContent='Bill #'+billNo;
  $('#billSub').textContent=mode+(mode==='Dine In'&&$('#tableSel').value?' - '+$('#tableSel').value:'')+' - '+cart.length+' line'+(cart.length===1?'':'s');
  $('#kotBtn').disabled=!cart.some(function(l){return l.qty-l.sentQty>0});
  $('#chargeBtn').disabled=!cart.length;
  renderStrip();
}

function payload(extra){
  var t=totals(), cs=$('#custSel'), cust=BOOT.customers.find(function(c){return c.id===cs.value})||{};
  var d={bill_no:billNo,service_mode:mode,table_name:mode==='Dine In'?($('#tableSel').value||''):'',
    customer_id:cs.value||'walkin',customer_name:cust.name||'Walk-in Customer',customer_phone:cust.phone||'',
    shift_id:(shift&&shift.id)||'',discount_amount:t.disc,service_charge:t.svc,tax_amount:t.tax,
    items:cart.map(function(l){return {menu_item_id:l.id,base_name:l.name,name:l.name,qty:l.qty,unit_price:l.price,sent_qty:l.sentQty,note:l.note||''}})};
  if(extra)for(var k in extra)d[k]=extra[k];
  return d;
}
function syncBill(r){if(r&&r.bill_no&&r.bill_no!==billNo){billNo=r.bill_no;toast('Server ne bill #'+billNo+' assign kiya')}}

$('#kotBtn').onclick=function(){
  if(!shift){openGate();return}
  var r=api('pos-kot',payload());
  if(!r.ok){toast(r.message||'KOT save nahi hua - kitchen ko NahI gaya');return}
  syncBill(r);
  cart.forEach(function(l){l.sentQty=l.qty});
  renderCart();toast('KOT sent - '+(r.sent||1)+' ticket');
};

$('#chargeBtn').onclick=function(){
  if(!shift){openGate();return}
  var t=totals(), pay='Cash';
  var ov=modal('<div class="dh"><h3>Charge Bill #'+billNo+'</h3><p>'+esc(mode)+' - '+cart.length+' line(s)</p></div>'
    +'<div class="db"><div class="kv"><span>Subtotal</span><b>'+money(t.sub)+'</b></div>'
    +'<div class="kv"><span>Discount</span><b>- '+money(t.disc)+'</b></div>'
    +'<div class="kv"><span>Service Charge</span><b>'+money(t.svc)+'</b></div>'
    +'<div class="kv"><span>Sales Tax</span><b>'+money(t.tax)+'</b></div>'
    +'<div class="kv" style="border:0;font-size:16px;padding-top:11px"><span style="font-weight:800;color:var(--ink)">Grand Total</span><b>'+money(t.grand)+'</b></div>'
    +'<div class="box"><label class="f">Payment Method</label><div class="pm">'
    +['Cash','Card','Raast','Easypaisa','JazzCash','Bank'].map(function(m,i){return '<button class="'+(i===0?'on':'')+'" data-pm="'+m+'">'+m+'</button>'}).join('')
    +'</div><label class="f">Amount Received</label><input class="inp" id="rcv" type="number" value="'+Math.round(t.grand)+'">'
    +'<div style="margin-top:9px;font-size:12.5px;display:flex;justify-content:space-between"><span style="color:var(--ink2)">Change to return</span><b id="chg">PKR 0</b></div></div></div>'
    +'<div class="df"><button class="sec" data-x>Cancel</button><button class="go" id="doPay">Complete Payment</button></div>');
  Array.prototype.forEach.call(ov.querySelectorAll('[data-pm]'),function(b){b.onclick=function(){
    Array.prototype.forEach.call(ov.querySelectorAll('[data-pm]'),function(o){o.classList.remove('on')});
    this.classList.add('on');pay=this.dataset.pm;
  }});
  function chg(){var v=Number(ov.querySelector('#rcv').value||0);ov.querySelector('#chg').textContent=money(Math.max(0,v-t.grand))}
  ov.querySelector('#rcv').oninput=chg;chg();
  ov.querySelector('#doPay').onclick=function(){
    var rcv=Number(ov.querySelector('#rcv').value||0);
    if(rcv<t.grand-0.5){toast('Received amount kam hai');return}
    this.disabled=true;this.textContent='Saving...';
    var r=api('pos-finalize',payload({payment_code:pay,received_amount:rcv}));
    if(!r.ok){this.disabled=false;this.textContent='Complete Payment';toast(r.message||'Bill save nahi hua');return}
    ov.remove();
    toast('Bill #'+(r.bill_no||billNo)+' complete - '+money(t.grand));
    newBill(r.next);
  };
};

function newBill(next){
  cart=[];disc={type:'flat',value:0};preQty={};
  if(!next){var n=api('pos-next-bill');next=n.ok?n.next:1}
  billNo=String(next||1).padStart(4,'0');
  $('#tableSel').value='';$('#custSel').value='walkin';
  renderCart();
}
$('#newBillBtn').onclick=function(){
  if(cart.length&&!confirm('Mojooda cart clear ho jayega. New bill shuru karein?'))return;
  newBill();toast('New bill #'+billNo);
};

function loadHolds(){

}
$('#holdsBtn').onclick=function(){
  loadHolds();
  var body=holds.length?holds.map(function(h,i){
    return '<div class="hold"><div><b>Bill #'+esc(h.billNo)+' - '+esc(h.table||h.mode)+'</b><small>'+(h.lines||0)+' items - '+money(h.total||0)+' - '+esc(h.at||'')+'</small></div><button data-res="'+i+'">Resume</button></div>';
  }).join(''):'<div class="cempty">Koi held bill nahi</div>';

    +'<div class="df"><button class="sec" data-x>Close</button>'+(cart.length?'<button class="go" id="holdNow">Hold Current Bill</button>':'')+'</div>');
  var hb=ov.querySelector('#holdNow');
  if(hb)hb.onclick=function(){
    var t=totals();
    var r=api('records-save',{module:HOLD_MODULE,data:{billNo:billNo,mode:mode,table:$('#tableSel').value||'',
      total:t.grand,lines:cart.length,at:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
      cart:JSON.stringify(cart),cust:$('#custSel').value}});

    ov.remove();newBill();loadHolds();toast('Bill hold kar diya');
  };
  Array.prototype.forEach.call(ov.querySelectorAll('[data-res]'),function(b){b.onclick=function(){
    var h=holds[this.dataset.res];
    try{cart=JSON.parse(h.cart||'[]')}catch(e){cart=[]}
    billNo=h.billNo;mode=h.mode||'Dine In';
    Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(m){m.classList.toggle('on',m.dataset.mode===mode)});
    if(h.table)$('#tableSel').value=h.table;
    if(h.cust)$('#custSel').value=h.cust;
    api('records-delete',{module:HOLD_MODULE,id:h.id});
    ov.remove();loadHolds();renderCart();toast('Bill #'+billNo+' resumed');
  }});
};

function openItemModal(startTab){

      +'<div class="full"><label class="f">Item Name *</label><input class="inp" id="iName" placeholder="Chicken Karahi"></div>'

      if(r.ok)toast('Category "'+nm+'" saved');
    }else{
      var id=ov.querySelector('#rSel').value, nr=Number(ov.querySelector('#rNew').value||0);
      if(!id||nr<=0){fail('Item aur valid rate select karein');return}
      r=api('menu-item-rate',{menu_item_id:id,price:nr});
      if(r.ok)toast('Rate updated: '+money(nr));
    }
    if(!r.ok){fail(r.message||'Save failed');return}
    ov.remove();boot();
  };
}

function openGate(){
  if(document.getElementById('gateOv'))return;
  var ov=modal('<div class="dh"><h3>Shift Opening</h3><p>POS billing shift open hone ke baad hi chalegi. Drawer ka opening cash count karke enter karein.</p></div>'
    +'<div class="db"><label class="f">Opening Cash (PKR)</label><input class="inp" id="oc" type="number" value="0" style="font-size:17px;font-weight:800"></div>'
    +'<div class="df"><button class="go" id="ob" style="flex:1">Open Shift and Start Billing</button></div>',false,true);
  ov.id='gateOv';
  setTimeout(function(){var i=ov.querySelector('#oc');i.focus();i.select()},60);
  ov.querySelector('#ob').onclick=function(){
    this.disabled=true;this.textContent='Opening...';
    var r=api('shift-open',{opening_cash:Number(ov.querySelector('#oc').value||0)});
    if(!r.ok){this.disabled=false;this.textContent='Open Shift and Start Billing';toast(r.message||'Failed');return}
    shift={id:r.id,shift_no:r.shift_no};ov.remove();renderStrip();toast('Shift '+r.shift_no+' opened');
  };
}
function repRows(r){
  function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'}
  var h=kv('Shift',esc(r.shift_no))+kv('Opened',esc(r.opened_at))+(r.closed_at?kv('Closed',esc(r.closed_at)):'');
  h+=kv('Opening Cash',money(r.opening_cash));
  h+=kv('Orders',r.orders+(r.first_bill?(' (#'+esc(r.first_bill)+' - #'+esc(r.last_bill)+')'):''));
  h+=kv('Gross Sales',money(r.gross_sales));
  for(var k in (r.by_method||{}))h+=kv('&nbsp;&nbsp;'+esc(k),money(r.by_method[k].amount)+' ('+r.by_method[k].count+')');
  h+=kv('Cash Expenses','- '+money(r.cash_expenses));
  h+=kv('<b style="color:var(--ink)">Expected Cash</b>','<b>'+money(r.expected_cash)+'</b>');
  if(typeof r.actual_cash!=='undefined'){
    h+=kv('Actual Counted',money(r.actual_cash));
    h+=kv('<b style="color:var(--ink)">Variance</b>','<b style="color:'+(Math.abs(r.variance)<1?'var(--ok)':'var(--brand)')+'">'+money(r.variance)+'</b>');
  }
  return h;
}
function closeShift(){
  var pr=api('shift-preview');
  if(!pr.ok){toast(pr.message||'Failed');return}
  var rep=pr.report;
  var ov=modal('<div class="dh"><h3>Shift Closing - '+esc(rep.shift_no)+'</h3><p>Cash count karke actual amount enter karein</p></div>'
    +'<div class="db">'+repRows(rep)+'<div class="box"><label class="f">Actual Counted Cash (PKR)</label>'
    +'<input class="inp" id="ac" type="number" value="'+Math.round(rep.expected_cash)+'" style="font-size:17px;font-weight:800">'
    +'<label class="f" style="margin-top:11px">Note</label><input class="inp" id="cn" placeholder="Optional"></div></div>'
    +'<div class="df"><button class="sec" data-x>Cancel</button><button class="go" id="cb">Close Shift and Report</button></div>');
  ov.querySelector('#cb').onclick=function(){
    this.disabled=true;this.textContent='Closing...';
    var r=api('shift-close',{actual_cash:Number(ov.querySelector('#ac').value||0),note:ov.querySelector('#cn').value||''});
    if(!r.ok){this.disabled=false;this.textContent='Close Shift and Report';toast(r.message||'Failed');return}
    ov.remove();shift=null;renderStrip();showReport(r.report);
  };
}
function showReport(rep){
  var ov=modal('<div class="dh"><h3>Shift Report</h3><p>Cashier reconciliation summary</p></div>'
    +'<div class="db" id="repBody">'+repRows(rep)+'</div>'
    +'<div class="df"><button class="sec" id="prn">Print</button><button class="go" id="dn">Done</button></div>',false,true);
  ov.querySelector('#prn').onclick=function(){
    var w=window.open('','_blank','width=420,height=680');
    w.document.write('<html><head><title>Shift Report</title><style>body{font-family:monospace;font-size:12px;padding:16px}.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #ccc}</style></head><body><h3>SHIFT REPORT</h3>'+document.getElementById('repBody').innerHTML+'</body></html>');
    w.document.close();w.print();
  };
  ov.querySelector('#dn').onclick=function(){ov.remove();openGate()};
}

function modal(html,wide,noClose){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="dlg'+(wide?' wide':'')+'">'+html+'</div>';
  document.body.appendChild(ov);
  Array.prototype.forEach.call(ov.querySelectorAll('[data-x]'),function(b){b.onclick=function(){ov.remove()}});
  if(!noClose)ov.onclick=function(e){if(e.target===ov)ov.remove()};
  return ov;
}

$('#q').oninput=function(){search=this.value;renderGrid()};
Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){
  b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(o){o.classList.remove('on')});
    this.classList.add('on');mode=this.dataset.mode;renderCart();
  };
});
$('#tableSel').onchange=renderCart;
$('#custSel').onchange=renderCart;
document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
});

boot();
</script>
</body>
</html>
