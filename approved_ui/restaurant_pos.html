<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Point of Sale &middot; Urban Spoon</title>
<style>
:root{
  --bg:#f2f6f3;--panel:#fff;--ink:#15221b;--ink2:#5f6f66;--ink3:#8b9a92;--l:#e1e9e4;
  --brand:#e23744;--brand2:#ff5864;--ok:#0f7a3d;--okbg:#eaf6ef;--warn:#b3541e;--warnbg:#fdf4e9;
  --sh:0 1px 2px rgba(21,34,27,.05),0 6px 18px rgba(21,34,27,.05);
  --shl:0 4px 12px rgba(21,34,27,.08),0 18px 40px rgba(21,34,27,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;font-size:12.5px}
button,input,select,textarea{font-family:inherit;font-size:12.5px;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.pos{display:grid;grid-template-columns:1fr 372px;grid-template-rows:auto auto 1fr;height:100vh}

/* ---------- top ---------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:8px 13px;background:var(--panel);border-bottom:1px solid var(--l)}
.iconb{width:32px;height:32px;border-radius:9px;border:1px solid var(--l);display:grid;place-items:center;font-size:15px;flex:none}
.iconb:hover{border-color:var(--brand);color:var(--brand)}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.search{flex:1;max-width:330px;display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--l);border-radius:999px;padding:7px 12px}
.search input{flex:1;border:0;background:none;outline:none}
.kbd{font-size:9px;color:var(--ink3);border:1px solid var(--l);border-radius:5px;padding:1px 5px;background:var(--panel)}
.tb{padding:7px 12px;border:1px solid var(--l);border-radius:9px;background:var(--panel);font-weight:700;white-space:nowrap;transition:.13s}
.tb:hover{border-color:var(--brand);color:var(--brand)}
.tb.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.tb.pri:hover{color:#fff;filter:brightness(1.06)}
.tb.amber{background:var(--warnbg);border-color:#f0cfa4;color:var(--warn)}
.who{display:flex;align-items:center;gap:8px;padding:4px 11px 4px 4px;border:1px solid var(--l);border-radius:999px;flex:none}
.av{width:26px;height:26px;border-radius:99px;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-weight:800;font-size:10px}
.who small{display:block;font-size:9px;color:var(--ink2)}
.who strong{display:block;font-size:11.5px}
.perio{display:flex;align-items:center;gap:5px;border:1px solid var(--l);border-radius:9px;padding:4px 8px;font-size:10.5px;color:var(--ink2);flex:none}
.perio select{border:0;outline:none;background:none;font-weight:700;color:var(--ink)}

/* ---------- strip ---------- */
.strip{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 13px;background:linear-gradient(90deg,#f6fbf8,#fff);border-bottom:1px solid var(--l);font-size:11.5px;overflow-x:auto;white-space:nowrap}
.sb{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #e1e9e4;border-radius:999px;padding:3px 10px;font-weight:700;flex:none;color:#15221b}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block}
.dot.g{background:var(--ok)}.dot.r{background:var(--brand)}
.strip a{color:var(--ok);font-weight:800;text-decoration:none;margin-left:3px}
.strip a.dn{color:var(--brand)}
.ver{margin-left:auto;font-size:9.5px;color:var(--ink3);font-weight:800;letter-spacing:.4px;flex:none}

/* ---------- left / products ---------- */
.left{overflow:auto;padding:10px 13px 16px}
.catrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;position:sticky;top:-10px;background:var(--bg);padding:4px 0 7px;z-index:5}
.cat{padding:7px 13px;border:1px solid var(--l);border-radius:999px;background:var(--panel);font-weight:700;font-size:11.5px;transition:.13s;box-shadow:var(--sh)}
.cat:hover{border-color:#b9cdc1}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat i{font-style:normal;opacity:.55;font-weight:600;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:9px}
.prod{background:var(--panel);border:1px solid var(--l);border-radius:11px;overflow:hidden!important;box-shadow:var(--sh);transition:.13s;display:flex;flex-direction:column;position:relative;isolation:isolate}
.prod img{max-width:100%;max-height:100%}
.pb{position:relative;z-index:2;background:#fff}
.prod:hover{transform:translateY(-3px);box-shadow:var(--shl);border-color:#c7dccf}
.th{height:92px;background:linear-gradient(135deg,#eef5f0,#e2ece6);cursor:pointer;display:grid;place-items:center;font-size:24px;position:relative;overflow:hidden!important}
.th img{position:absolute!important;top:0;left:0;width:100%!important;height:100%!important;object-fit:cover;display:block;max-width:100%;max-height:100%}
.bdg{position:absolute;top:5px;right:5px;background:rgba(21,34,27,.84);color:#fff;font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:999px}
.pb{padding:8px 9px 9px;display:flex;flex-direction:column;gap:5px;flex:1;position:relative;z-index:2;background:#fff}
.prod .pb .pn{font-size:13px!important;font-weight:800!important;line-height:1.3;min-height:34px;color:#15221b!important;word-break:break-word;display:block!important;visibility:visible!important;opacity:1!important}
.catbdg{position:absolute;left:5px;bottom:5px;background:rgba(255,255,255,.92);color:var(--ink2);font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
.imgb{position:absolute;left:5px;top:5px;background:rgba(255,255,255,.92);border-radius:999px;width:22px;height:22px;font-size:11px;line-height:1;opacity:0;transition:.13s}
.imgb.delb{left:32px;color:#c54f59}

.prod:hover .imgb{opacity:1}
.imgb:hover{background:#fff;transform:scale(1.1)}
.imgprev{height:170px;border:1px solid var(--l);border-radius:12px;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:190px;overflow:auto}
.imgcell{border:2px solid var(--l);border-radius:9px;overflow:hidden;height:66px;padding:0;background:var(--bg)}
.imgcell img{width:100%;height:100%;object-fit:cover;display:block}
.imgcell.on{border-color:var(--ok);box-shadow:0 0 0 2px rgba(15,122,61,.2)}
.pc{font-size:9px;color:var(--ink3);font-weight:600;letter-spacing:.2px;text-transform:uppercase;opacity:.85}
.pp{font-size:13px;font-weight:800;color:var(--ok)}
.pp small{font-size:9px;font-weight:700;color:var(--ink3)}
.prow{display:flex;align-items:center;gap:5px;margin-top:auto}
.qb{display:flex;align-items:center;border:1px solid var(--l);border-radius:7px;overflow:hidden}
.qb button{width:19px;height:22px;font-weight:800;color:var(--ink2);font-size:12px}
.qb button:hover{background:var(--bg);color:var(--brand)}
.qb span{min-width:26px;text-align:center;font-weight:800;font-size:10.5px;cursor:pointer}
.qb span:hover{color:var(--brand)}
.ab{flex:1;padding:6px;border-radius:7px;background:var(--brand);color:#fff;font-weight:800;font-size:11px}
.ab:hover{filter:brightness(1.07)}
.empty{grid-column:1/-1;padding:44px 20px;text-align:center;border:1.5px dashed #cfdcd4;border-radius:12px;background:var(--panel)}
.empty .ic{font-size:34px;margin-bottom:9px}
.empty h3{font-size:14.5px;margin-bottom:4px}
.empty p{font-size:12px;color:var(--ink2);margin-bottom:14px}

/* ---------- right / bill ---------- */
.right{background:var(--panel);border-left:1px solid var(--l);display:flex;flex-direction:column;overflow:hidden}
.rh{padding:10px 12px;border-bottom:1px solid var(--l)}
.rh1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rh1 h2{font-size:14px;font-weight:800}
.rh1 .sub{font-size:9.5px;color:var(--ink2);margin-top:1px}
.pills{display:flex;gap:5px;margin-bottom:7px}
.pill{flex:1;padding:6px;border:1px solid var(--l);border-radius:8px;font-weight:700;font-size:11px;transition:.13s}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.selrow{display:flex;gap:5px}
.selrow select{flex:1;padding:7px 8px;border:1px solid var(--l);border-radius:8px;background:var(--panel);outline:none;min-width:0;font-size:11.5px}
.selrow .mini{padding:7px 9px;border:1px solid var(--l);border-radius:8px;font-weight:800;font-size:11px;flex:none}
.selrow .mini:hover{border-color:var(--brand);color:var(--brand)}
.ctx{display:inline-flex;gap:5px;align-items:center}
.strip .ctx span{background:#fff!important;border:1px solid #e1e9e4;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;color:#15221b!important}
.strip .ctx span b{color:#0f7a3d!important}
.strip .ctx .chg{cursor:pointer;color:#15221b!important}
.strip .ctx .chg:hover{border-color:#e23744;color:#e23744!important}
.thead{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 12px;background:#fbfdfc;border-bottom:1px solid var(--l);font-size:9px;font-weight:800;color:var(--ink3);letter-spacing:.4px}
.thead span:nth-child(2){text-align:right}
.thead{color:#8b9a92}
.items{flex:1;overflow:auto}
.ci{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 12px;border-bottom:1px solid var(--l);align-items:center;cursor:pointer;transition:.12s}
.ci:hover{background:#f7fbf9}
.ciq{display:flex;align-items:center;border:1px solid var(--l);border-radius:6px;overflow:hidden}
.ciq button{width:18px;height:24px;font-weight:800;color:var(--ink2);font-size:12px}
.ciq button:hover{background:var(--bg);color:var(--brand)}
.ciq span{flex:1;text-align:center;font-weight:800;font-size:11px}
.cid{min-width:0}
.cid b{font-size:13px;font-weight:800;display:block;line-height:1.3;color:#15221b!important;word-break:break-word}
.cid small{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.cid small .qx{font-size:12px;font-weight:800;color:#0f7a3d!important;background:#eaf6ef;border-radius:6px;padding:1px 7px}
.cid small .nt{font-size:11px;font-weight:700;color:#b3541e!important;background:#fdf4e9;border-radius:6px;padding:1px 7px}
.sn{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:6px;background:#15221b;color:#fff!important;font-size:10.5px;font-weight:800;margin-right:7px;vertical-align:middle}
.cit{text-align:right;font-size:14.5px;font-weight:800;color:#15221b!important;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.cit{font-weight:800}
.cix{color:var(--brand);font-size:16px;font-weight:800;margin-left:5px;line-height:1}
.cix:hover{color:#a5121d}
.sent{font-size:11px;font-weight:800;color:#0f7a3d!important;background:#eaf6ef;border:1px solid #b9e0c8;border-radius:6px;padding:1px 7px}
.cempty{padding:46px 18px;text-align:center;color:var(--ink3);font-size:11.5px}
.qrow{display:flex;gap:5px;padding:7px 12px;border-top:1px solid var(--l);flex-wrap:wrap}
.qrow button{flex:1;min-width:66px;padding:6px;border:1px solid var(--l);border-radius:7px;font-weight:700;font-size:10.5px}
.qrow button:hover{border-color:var(--brand);color:var(--brand)}
.tot{border-top:1px solid var(--l);padding:9px 12px;background:#fbfdfc}
.tr{display:flex;justify-content:space-between;padding:2.5px 0;font-size:11.5px}
.tr .lb{color:var(--ink2);display:flex;align-items:center;gap:5px}
.ed{font-size:9px;background:var(--bg);border:1px solid var(--l);border-radius:4px;padding:0 5px;font-weight:700;color:var(--ink2)}
.ed:hover{color:var(--brand);border-color:var(--brand)}
.gt{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding:9px 11px;background:var(--ink);color:#fff;border-radius:10px}
.gt b{font-size:16px;font-weight:800}
.acts{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--l)}
.acts button{flex:1;padding:12px;border-radius:10px;font-weight:800;font-size:12px;transition:.13s}
.kot{background:#f5a623;color:#fff}
.chg{background:var(--ok);color:#fff;flex:1.4}
.acts button:disabled{opacity:.42;cursor:not-allowed}
.acts button:not(:disabled):hover{filter:brightness(1.07)}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--panel);border-right:1px solid var(--l);transform:translateX(-100%);transition:.22s;z-index:800;padding:16px 0;overflow:auto}
.drawer.on{transform:none;box-shadow:var(--shl)}
.drawer h4{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.6px;padding:9px 18px 5px}
.drawer a{display:flex;align-items:center;gap:9px;padding:9px 18px;font-weight:600;color:var(--ink);text-decoration:none;font-size:12.5px}
.drawer a:hover{background:var(--bg);color:var(--brand)}
.scrim{position:fixed;inset:0;background:rgba(10,24,17,.42);z-index:790;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ---------- modals ---------- */
.ov{position:fixed;inset:0;background:rgba(10,24,17,.55);backdrop-filter:blur(3px);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border-radius:16px;box-shadow:0 28px 74px rgba(0,0,0,.34);width:100%;max-width:420px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{max-width:620px}
.dh{padding:15px 18px 12px;border-bottom:1px solid var(--l)}
.dh h3{font-size:14.5px;font-weight:800}
.dh p{font-size:11px;color:var(--ink2);margin-top:2px}
.db{padding:15px 18px;overflow:auto;flex:1}
.df{padding:12px 18px;border-top:1px solid var(--l);display:flex;gap:8px}
.df button{flex:1;padding:11px;border-radius:10px;font-weight:800;transition:.13s}
.df .sec{border:1px solid var(--l);background:var(--panel)}
.df .go{background:var(--brand);color:#fff;flex:1.5}
.df button:hover{filter:brightness(1.05)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
label.f{display:block;font-size:9.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--l);border-radius:9px;background:var(--panel);outline:none;transition:.13s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(226,55,68,.1)}
textarea.inp{min-height:62px;resize:vertical}
.tabs{display:flex;gap:5px;padding:0 18px 12px}
.tab{flex:1;padding:7px;border:1px solid var(--l);border-radius:8px;font-weight:700;font-size:11px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--l);font-size:12px}
.kv span{color:var(--ink2)}
.box{background:var(--bg);border:1px solid var(--l);border-radius:10px;padding:11px;margin-top:10px}
/* calculator */
.cdisp{background:var(--ink);color:#fff;border-radius:12px;padding:13px 16px;text-align:right;margin-bottom:11px}
.cdisp small{display:block;font-size:9.5px;opacity:.65;font-weight:700;letter-spacing:.5px}
.cdisp b{font-size:30px;font-weight:800;line-height:1.15}
.qv{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:9px}
.qv button{padding:7px 2px;border:1px solid var(--l);border-radius:7px;font-weight:800;font-size:10.5px;background:var(--bg)}
.qv button:hover{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{padding:14px 0;border:1px solid var(--l);border-radius:10px;font-weight:800;font-size:16px;background:var(--panel)}
.pad button:hover{background:var(--bg);border-color:var(--brand);color:var(--brand)}
.pad button[data-clear]{background:var(--warnbg);border-color:#f0cfa4;color:var(--warn);font-size:12.5px}
/* option chips */
.opts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.opt{padding:9px 14px;border:1px solid var(--l);border-radius:10px;font-weight:700;font-size:11.5px}
.opt.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.nbmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nbm{padding:22px 12px;border:1.5px solid var(--l);border-radius:14px;background:var(--panel);text-align:center;transition:.14s}
.nbm:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shl)}
.nbm b{display:block;font-size:14px;margin-bottom:4px}
.nbm small{font-size:10.5px;color:var(--ink2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:40vh;overflow:auto}
.tcard{padding:12px 8px;border:1px solid var(--l);border-radius:11px;background:var(--panel);text-align:center;transition:.13s}
.tcard:hover{border-color:var(--ok);transform:translateY(-2px)}
.tcard.busy{background:var(--warnbg);border-color:#f0cfa4}
.tcard.cur{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 0 2px rgba(15,122,61,.18)}
.tcard b{display:block;font-size:12px}
.tcard small{font-size:9.5px;color:var(--ink2)}
.clab{font-size:9.5px;font-weight:800;color:var(--ink3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.checks{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.checks label{display:flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--l);border-radius:8px;padding:7px 10px;cursor:pointer}
/* payment */
.pmg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
.pmg button{padding:9px 5px;border:1px solid var(--l);border-radius:9px;font-weight:700;font-size:11px}
.pmg button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.ptot{background:var(--ink);color:#fff;border-radius:12px;padding:13px 15px;margin-bottom:12px}
.ptot span{font-size:10px;opacity:.7;font-weight:700;letter-spacing:.5px}
.ptot b{display:block;font-size:25px;font-weight:800;margin-top:2px}
.ptot small{font-size:10px;opacity:.65}
.chgbox{background:var(--okbg);border:1px solid #b9e0c8;border-radius:10px;padding:10px 12px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.chgbox b{font-size:17px;font-weight:800;color:var(--ok)}
/* list rows */
.lrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--l);border-radius:10px;margin-bottom:7px}
.lrow b{font-size:12px}.lrow small{display:block;font-size:10px;color:var(--ink2);margin-top:1px}
.lrow button{padding:6px 12px;background:var(--okbg);color:var(--ok);border-radius:8px;font-weight:800;font-size:10.5px}
/* slip */
.slip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#fff;border:1px dashed var(--l);border-radius:8px;padding:14px}
.slip h4{text-align:center;font-size:13px;margin-bottom:2px}
.slip .kotType{text-align:center;font-size:16px;font-weight:800;letter-spacing:1px}
.slip .kotTag{text-align:center;font-size:12px;font-weight:800;margin:3px 0 4px;border:2px solid #000;padding:2px}
.slip .kq{font-size:16px;font-weight:800;width:42px;vertical-align:top}
.slip .kn{font-size:14px;font-weight:700;padding-bottom:6px}
.slip .kn i{font-size:11px;font-weight:600}
.slip .c{text-align:center;color:var(--ink2);font-size:10px}
.slip hr{border:0;border-top:1px dashed #c9d4cd;margin:8px 0}
.slip table{width:100%;border-collapse:collapse}
.slip td{padding:2px 0;vertical-align:top}
.slip .r{text-align:right}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;opacity:0;transition:.24s;z-index:990;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1150px){.pos{grid-template-columns:1fr 330px}}
</style>
</head>
<body>
<div id="licBar"></div>
<div class="pos">
  <header class="top">
    <button class="mark" id="homeBtn" title="Home">U</button>

var CSRF=window.APP_CSRF||'';

function api(action,payload){
  try{
    var x=new XMLHttpRequest();
    x.open(payload?'POST':'GET','/api.php?action='+action,false);
    x.setRequestHeader('Accept','application/json');
    if(payload){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('X-CSRF-Token',CSRF);}
    x.send(payload?JSON.stringify(payload):null);
    var txt=x.responseText||'';
    var i=txt.indexOf('{');
    if(i>0)txt=txt.slice(i);          // PHP warning/notice JSON se pehle
    var j=txt.lastIndexOf('}');
    if(j>-1)txt=txt.slice(0,j+1);
    var r;
    try{r=JSON.parse(txt||'{}')}
    catch(e){return {ok:false,message:'Server ne galat jawab bheja: '+(x.responseText||'').slice(0,140)}}
    if(!r.ok&&r.message)console.warn(action,r.message);
    return r;
  }catch(e){return {ok:false,message:(e&&e.message)||'Server unreachable'}}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function qfmt(q){return (Number(q)%1)?Number(q).toFixed(3).replace(/0+$/,'').replace(/\.$/,''):String(q)}

/* ============ CLOUD SYNC INDICATOR (live) ============
   Strip par chip: kab last sync hua, kitni rows baqi hain, cloud online
   hai ya nahi. Click par foran sync. Har 2 minute khud bhi chalti hai. */
var SYNC={state:null,busy:false};

/* Sync calls network par lambi ho sakti hain. Synchronous XHR poore POS ko
   freeze kar deti thi (cashier billing na kar pata), is liye yeh async hai. */
function apiAsync(action,payload,cb){
  var x=new XMLHttpRequest();
  x.open(payload?'POST':'GET','/api.php?action='+action,true);
  x.setRequestHeader('Accept','application/json');
  if(payload){x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('X-CSRF-Token',window.APP_CSRF||'')}
  x.timeout=180000;
  x.onload=function(){
    var j={ok:false,message:'Server error'};
    try{j=JSON.parse(x.responseText||'{}')}catch(e){}
    cb(j);
  };
  x.onerror=function(){cb({ok:false,message:'Network error'})};
  x.ontimeout=function(){cb({ok:false,message:'Request timed out'})};
  try{x.send(payload?JSON.stringify(payload):null)}catch(e){cb({ok:false,message:'Request failed'})}
}
function agoText(ts){
  if(!ts)return 'never';
  var t=new Date(String(ts).replace(' ','T')).getTime();
  if(isNaN(t))return 'never';
  var m=Math.floor((Date.now()-t)/60000);
  if(m<1)return 'just now';
  if(m<60)return m+' min ago';
  var h=Math.floor(m/60); if(h<24)return h+' hr ago';
  return Math.floor(h/24)+' d ago';
}
function paintSync(){
  var el=$('#syncChip'); if(!el)return;
  var s=SYNC.state;
  if(!s){el.innerHTML='&#9729; checking...';el.style.background='';return}
  if(s.role==='cloud'){el.innerHTML='&#9729; Cloud server';el.style.background='';return}
  if(SYNC.busy){el.innerHTML='&#8635; Syncing...';el.style.background='#fdf4e9';return}
  if(!s.enabled){
    el.innerHTML='&#9888; Sync off &mdash; click to check';el.style.background='#fdecec';
    el.title=s.reason||'Sync disabled';return;
  }
  if(!s.cloud_online){
    el.innerHTML='&#9888; Offline'+(s.pending?(' &middot; '+s.pending+' pending'):'')+' &mdash; click to check';
    el.style.background='#fdecec';
    el.title=(s.last_error||'Cloud reachable nahi')+'\nClick please: kya masla hai wo dikhaya jayega';return;
  }
  if(s.pending>0){
    el.innerHTML='&#8635; '+s.pending+' to sync';el.style.background='#fdf4e9';
    el.title='Click to sync now';return;
  }
  el.innerHTML='&#9729;&#10003; Synced &middot; '+agoText(s.last_run);
  el.style.background='#eaf6ef';
  el.title='Last sync: '+(s.last_run||'-')+(s.cloud_url?('\ncloud: '+s.cloud_url):'');
}
/* ---- Sync kyun nahi ho rahi: step-by-step check ---- */
function syncDiagnose(){
  var ov=modal('<div class="dh"><h3>Cloud Sync Check</h3><p>Har step check ho raha hai...</p></div>'
    +'<div class="db" id="dgBody"><div class="cempty">Checking connection...</div></div>'
    +'<div class="df"><button class="sec" data-x>Close (Esc)</button><button class="sec" id="dgCopy">Copy Report</button>'
    +'<button class="go" id="dgRetry">Retry Sync</button></div>',true);
  apiAsync('sync-diagnose',null,function(r){
    var checks=(r.ok&&r.checks)?r.checks:[{step:'Request',ok:false,detail:(r.message||'Diagnose failed')}];
    var firstFail=null;
    var html=checks.map(function(c){
      if(!c.ok&&!firstFail)firstFail=c;
      return '<div class="lrow" style="align-items:flex-start">'
        +'<div style="font-size:16px;width:24px;flex:none">'+(c.ok?'\u2705':'\u274C')+'</div>'
        +'<div style="flex:1"><b>'+esc(c.step)+'</b><small style="word-break:break-word">'+esc(c.detail)+'</small></div></div>';
    }).join('');
    if(firstFail)html+='<div class="box" style="border-color:var(--brand)"><b style="font-size:11.5px;color:var(--brand)">Kya karna hai</b>'
      +'<div style="font-size:11.5px;margin-top:5px;line-height:1.6">'+esc(fixHint(firstFail))+'</div></div>';
    else html+='<div class="box" style="border-color:var(--ok)"><b style="font-size:11.5px;color:var(--ok)">Sab theek hai</b>'
      +'<div style="font-size:11.5px;margin-top:5px">Connection kaam kar raha hai. "Retry Sync" dabayein.</div></div>';
    var bd=ov.querySelector('#dgBody'); if(bd)bd.innerHTML=html;
    window.__dgReport=checks.map(function(c){return (c.ok?'OK  ':'FAIL')+'  '+c.step+': '+c.detail}).join('\n');
  });
  ov.querySelector('#dgCopy').onclick=function(){
    if(navigator.clipboard)navigator.clipboard.writeText(window.__dgReport||'');
    toast('Report copy done');
  };
  ov.querySelector('#dgRetry').onclick=function(){ov.remove();syncNow(true)};
}
function fixHint(f){
  var st=(f.step||'').toLowerCase(), d=(f.detail||'').toLowerCase();
  if(st.indexOf('configuration')>=0)  return 'Sync configuration mein band hai. Portal se package dobara download please.';
  if(st.indexOf('cloud url')>=0||st.indexOf('token')>=0&&d.indexOf('missing')>=0)
    return 'Is installation mein cloud ki settings nahi hain. Portal > POS > System > Download Offline Version se naya package le kar dobara install please.';
  if(st.indexOf('ssl')>=0)            return 'HTTPS certificates nahi mile. Package dobara download please (naye package mein certificates shamil hain), ya INSTALL_OFFLINE.bat dobara please run.';
  if(st.indexOf('dns')>=0)            return 'Internet chal raha hai magar server ka naam resolve nahi ho raha. WiFi/DNS check please; mobile hotspot se try please.';
  if(st.indexOf('connection')>=0)     return 'Server tak connection nahi ban raha. Aksar Windows Firewall ya antivirus PHP ko rok deta hai - usme php.exe ko allow please. Office proxy ho to wo bhi rok sakta hai.';
  if(st.indexOf('curl')>=0)           return 'PHP ka curl extension not found. runtime\\php folder delete kar ke INSTALL_OFFLINE.bat dobara please run.';
  if(st.indexOf('cloud response')>=0){
    if(d.indexOf('certificate')>=0||d.indexOf('ssl')>=0||d.indexOf('60')>=0)
      return 'SSL certificate verify nahi ho saka. Naya package download please - us mein certificates shamil hain.';
    if(d.indexOf('403')>=0||d.indexOf('401')>=0) return 'Cloud ne request reject kar di. Business suspend to nahi? Portal par status check please.';
    return 'Cloud server ne jawab to diya magar galat. Thodi der baad try please; masla rahe to yeh report support ko bhejein.';
  }
  if(st.indexOf('token accepted')>=0) return 'Cloud ne is package ka token qubool nahi kiya. Portal se package dobara download please (token nayi ban jayegi).';
  return 'Yeh report Copy kar ke support ko bhej dein.';
}

function refreshSync(cb){
  apiAsync('sync-state',null,function(r){
    if(r.ok&&r.sync){SYNC.state=r.sync;paintSync();}
    if(cb)cb(r);
  });
}
function syncNow(manual){
  var s=SYNC.state;
  if(s&&s.role==='cloud'){if(manual)toast('Yeh cloud server hai - sync offline node se chalti hai');return}
  if(s&&!s.enabled){if(manual)toast(s.reason||'Sync is off');return}
  if(SYNC.busy)return;
  SYNC.busy=true;paintSync();
  apiAsync('sync-run',{},function(r){
    SYNC.busy=false;
    if(!r.ok){
      if(manual)toast(r.message||'Sync failed');
      if(SYNC.state)SYNC.state.last_error=r.message||'failed';
    }else if(manual){
      var pushed=0;for(var k in (r.pushed||{}))pushed+=r.pushed[k];
      toast('Sync complete'+(pushed?(' - '+pushed+' rows uploaded'):' - already up to date'));
    }
    refreshSync();
  });
}

function pairDevice(role,label){
  var r=api('device-pair-start',{role:role,name:label});

  var urls=r.urls||[];
  var body=urls.map(function(u,i){
    return '<div style="text-align:center;margin-bottom:14px">'
      +'<img src="/api.php?action=qr&scale=6&data='+encodeURIComponent(u)+'" '
      +'style="width:230px;height:230px;border:1px solid var(--l);border-radius:12px" alt="" onerror="qrFail(this)">'
      +'<div style="font-size:11px;color:var(--ink2);margin-top:6px;word-break:break-all">'+esc(u)+'</div></div>';
  }).join('')||'<div class="cempty">Network address not found</div>';
  var ov=modal('<div class="dh"><h3>Connect '+esc(label)+'</h3>'
    +'<p>Device ko isi WiFi se milayein, phir yeh QR scan please. Code '+(r.expires_min||15)+' minute tak valid hai.</p></div>'
    +'<div class="db">'+body
    +'<div class="box" style="font-size:11px;color:var(--ink2)">'
    +'<b>Note:</b> Tablet POS computer ke saath usi local network (WiFi/LAN) par hona is required. '
    +'Internet ki zaroorat nahi - sab kuch is computer se chalta hai.</div></div>'
    +'<div class="df"><button class="sec" data-x>Close (Esc)</button><button class="sec" id="pairList">Connected Devices</button>'
    +'<button class="go" id="pairNew">New Code</button></div>',true);
  ov.querySelector('#pairNew').onclick=function(){ov.remove();pairDevice(role,label)};
  ov.querySelector('#pairList').onclick=function(){ov.remove();deviceList()};
}
function deviceList(){

/* Cashier ko sirf allowed cheezein: item/price/settings admin ke liye */
function applyRole(){
  /* Modules jo user ko assign NahI, unke buttons hata do */
  var mods=(CAN.modules||[]);
  var hasMod=function(k){return CAN.manage||mods.indexOf(k)>=0};
  /* V77 — item banana aur rate badalna MANAGER ka kaam hai.
     Cashier ka POS sirf billing par focus rahe. (Server par bhi rok hai
     — sirf button chhupana kaafi nahi hota.) */
  if(!hasMod('menu')||!CAN.manage){var e=$('#newItemBtn');if(e)e.classList.add('hide')}
  /* Header ka New Bill wahi kaam karta hai jo strip wala. */
  (function(){var lo=$('#posLogout');
    if(lo)lo.onclick=function(){
      /* Khuli shift KHAMOSHI se band nahi hoti — logout aur shift do
         alag cheezein hain. Cashier ko saaf batao. */
      var msg='Sign out now?';
      try{ var sh=DBApi.req('shift-current'); if(sh&&sh.ok&&sh.shift)
        msg='Your shift stays open. You can sign back in and continue.\n\nSign out now?'; }catch(e){}
      if(!confirm(msg))return;
      var to='login.html';
      try{ var r=DBApi.req('logout',{}); if(r&&r.redirect)to=r.redirect; }catch(e){}
      location.href=to;
    };})();

  (function(){var nb=$('#newBillTop');
    if(nb)nb.onclick=function(){var b=$('#newBillBtn'); if(b)b.click(); else if(window.newBill)newBill();};})();

  /* Bill par chhapne wali business details ek dafa le lo — har print
     par server call karna slip ko sust kar deta hai. */
  try{
    var __bs=DBApi.req('settings-get');
    if(__bs&&__bs.ok){
      window.__BILLSET=__bs.settings;
      /* Footer aur paper Settings se — wahi jagah jahan bill template
         chuna jata hai. Pehle yeh sirf localStorage mein tha, is liye
         har computer par alag ho jata tha aur Settings ka koi asar nahi
         hota tha. QR default ON hai; purani localStorage value se off
         para ho to bhi FBR bill par QR aana chahiye. */
      if(__bs.settings.receipt_footer)PRINT.footer=__bs.settings.receipt_footer;
      if(__bs.settings.receipt_paper)PRINT.size=Number(String(__bs.settings.receipt_paper).replace(/\D/g,''))||80;
      if(PRINT.qr===undefined)PRINT.qr=true;
    }
  }catch(e){}

  if(!hasMod('void')){var v=$('#voidBtn');if(v)v.classList.add('hide')}

  /* V72 — jo cheezein SIRF offline version par kaam karti hain, wo cloud
     par dikhni hi nahi chahiyen. Tablet aur printers LAN par hote hain
     aur FBR ka fiscal service localhost par — online portal se un tak
     pohancha hi nahi ja sakta. Button dikha kar phir "yeh yahan nahi
     chalta" kehna customer ka waqt zaya karna hai. */
  if((window.APP_ROLE||'local')==='cloud'){
    ['tabletBtn'].forEach(function(id){var e=$('#'+id);if(e)e.classList.add('hide')});
  }
  if(!hasMod('settings')&&!CAN.manage){var st=$('#sysBtn');if(st)st.classList.add('hide')}
  if(CAN.manage)return;
  ['newItemBtn','sysBtn','voidBtn'].forEach(function(id){var e=$('#'+id);if(e)e.classList.add('hide')});
  var shiftBtn=document.getElementById('myShiftBtn');
  if(!shiftBtn){
    var b=document.createElement('button');b.className='tb';b.id='myShiftBtn';b.textContent='My Shift';
    b.onclick=myShift;
    var host=$('#dupBtn');if(host&&host.parentNode)host.parentNode.insertBefore(b,host);
  }
}

function boot(){

    renderAll();
    banner('<span>&#9888; Menu load nahi hua &mdash; server: <b>'+esc((r&&r.message)||'no response')+'</b></span>'
      +'<button class="tb" id="diagBtn" style="padding:4px 10px">Run Diagnostics</button>');

  BOOT=r.boot;

  refreshSync();
  setInterval(refreshSync,30000);           /* chip har 30s update */

     hatte hi timer mar jata tha. Ab background loop (60s) kaam karta hai;
     yahan sirf chip refresh hota hai. */
  if(!shift){openGate();return}
  if(!cart.length&&!billStarted)newBillFlow();
}

/* ================= CALCULATOR ================= */
function calculator(title,cur,cb){
  var val=String(cur||''), fresh=true;
  var ov=modal('<div class="dh"><h3>Quantity Calculator</h3><p>'+esc(title)+' &mdash; decimal values (2.5) supported.</p></div>'
    +'<div class="db"><div class="cdisp"><small>QUANTITY</small><b id="cval">'+esc(val)+'</b></div>'
    +'<div class="qv">'+['0.10','0.25','0.50','0.75','1.00','1.50'].map(function(v){return '<button data-set="'+v+'">'+v+'</button>'}).join('')+'</div>'
    +'<div class="pad">'+['7','8','9','4','5','6','1','2','3','.','0'].map(function(d){return '<button data-digit="'+d+'">'+d+'</button>'}).join('')
    +'<button data-clear>Clear</button></div></div>'
    +'<div class="df"><button class="sec" data-x>Cancel</button><button class="go" id="applyCalc">Apply / Enter</button></div>');
  function show(){ov.querySelector('#cval').textContent=val||'0'}
  Array.prototype.forEach.call(ov.querySelectorAll('[data-digit]'),function(b){b.onclick=function(){
    if(fresh){val='';fresh=false}
    var d=this.dataset.digit;
    if(d==='.'&&val.indexOf('.')>=0)return;
    val+=d;show();
  }});
  Array.prototype.forEach.call(ov.querySelectorAll('[data-set]'),function(b){b.onclick=function(){val=this.dataset.set;fresh=false;show()}});
  ov.querySelector('[data-clear]').onclick=function(){val='';fresh=false;show()};
  function apply(){
    var n=Number(val||0);
    if(!(n>0)){toast('Valid quantity enter please');return}
    ov.remove();document.removeEventListener('keydown',key);cb(n);
  }
  ov.querySelector('#applyCalc').onclick=apply;
  function key(e){
    if(/^[0-9.]$/.test(e.key)){e.preventDefault();if(fresh){val='';fresh=false}if(e.key==='.'&&val.indexOf('.')>=0)return;val+=e.key;show();return}
    if(e.key==='Backspace'){e.preventDefault();val=val.slice(0,-1);show();return}
    if(e.key==='Enter'){e.preventDefault();apply()}
    if(e.key==='Escape'){document.removeEventListener('keydown',key)}
  }
  document.addEventListener('keydown',key);
}

/* ================= ADD ITEM (variants / weight / note) ================= */
function addItem(id){
  if(!shift){openGate();toast('Pehle shift/account open please');return}
  if(!billStarted){newBillFlow();toast('Pehle bill ki type select please');return}
  var p=BOOT.products.find(function(x){return x.id===id});
  if(!p)return;
  if(p.pizza){optionsModal(p);return}
  if(p.weighted){calculator(p.name+' &mdash; weight in KG',preQty[id]||1,function(v){push(p,v,'')});return}
  push(p,preQty[id]||1,'');
}
function push(p,qty,note,label){
  var name=label||p.name;
  var line=cart.find(function(l){return l.id===p.id&&l.name===name&&(l.note||'')===(note||'')});
  if(line)line.qty+=qty; else cart.push({id:p.id,name:name,qty:qty,price:p.price,sentQty:0,note:note||''});
  preQty[p.id]=1;renderGrid();renderCart();
}
function optionsModal(p){
  var variants=(p.variants&&p.variants.length)?p.variants:[{name:'Regular',price:p.price}];
  var sel=0;
  var ov=modal('<div class="dh"><h3>'+esc(p.name)+'</h3><p>Select variant and kitchen comments.</p></div>'
    +'<div class="db"><div class="clab">Select Variant</div><div class="opts" id="vopts">'
    +variants.map(function(v,i){return '<button class="opt'+(i===0?' on':'')+'" data-v="'+i+'">'+esc(v.name)+' &middot; '+money(v.price)+'</button>'}).join('')
    +'</div><div class="clab">Kitchen Comments</div><textarea class="inp" id="pnote" placeholder="No olives, extra cheese, cut into 8 slices..."></textarea></div>'
    +'<div class="df"><button class="sec" data-x>Cancel</button><button class="go" id="addOpt">Add to Order</button></div>',true);
  Array.prototype.forEach.call(ov.querySelectorAll('[data-v]'),function(b){b.onclick=function(){
    Array.prototype.forEach.call(ov.querySelectorAll('[data-v]'),function(o){o.classList.remove('on')});
    this.classList.add('on');sel=Number(this.dataset.v);
  }});
  ov.querySelector('#addOpt').onclick=function(){
    var v=variants[sel];
    push({id:p.id,name:p.name,price:v.price},preQty[p.id]||1,ov.querySelector('#pnote').value.trim(),p.name+' ('+v.name+')');
    ov.remove();toast(p.name+' added');
  };
}

    +'<div data-ip="find" style="margin-top:11px">'

    +'</div>'
    +'<div class="df"><button class="sec" data-x>Cancel (Esc)</button><button class="sec" id="ipClear">Remove</button><button class="go" id="ipSave">Save Picture</button></div>',true);

  function setUrl(u){url=u;picked=true;var im=ov.querySelector('#ipImg');im.style.visibility='visible';im.src=u}
  Array.prototype.forEach.call(ov.querySelectorAll('[data-it]'),function(b){b.onclick=function(){
    Array.prototype.forEach.call(ov.querySelectorAll('[data-it]'),function(o){o.classList.remove('on')});
    b.classList.add('on');
    Array.prototype.forEach.call(ov.querySelectorAll('[data-ip]'),function(pane){pane.classList.toggle('hide',pane.dataset.ip!==b.dataset.it)});
  }});

  function runSearch(more){
    var q=(ov.querySelector('#ipQ').value||p.name||'').trim();
    var box=ov.querySelector('#ipRes');
    box.innerHTML='<div class="cempty">Searching...</div>';
    var r=api('menu-image-search&q='+encodeURIComponent(q)+(more?('&page='+(1+Math.floor(Math.random()*4))):''));
    if(!r.ok||!r.images||!r.images.length){box.innerHTML='<div class="cempty">Koi photo not found &mdash; Upload Image tab use please</div>';return}
    window.__ipRes=r.images;
    box.innerHTML='<div class="imgres">'+r.images.map(function(im,i){
      return '<button class="imgcell" data-pick="'+i+'" title="'+esc(im.title||'')+'"><img src="'+esc(im.thumb)+'" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></button>';
    }).join('')+'</div>'+(r.source?('<div style="font-size:10px;color:var(--ink3);margin-top:5px">source: '+esc(r.source)+'</div>'):'');
    Array.prototype.forEach.call(box.querySelectorAll('[data-pick]'),function(b){b.onclick=function(){
      setUrl(window.__ipRes[b.dataset.pick].url||window.__ipRes[b.dataset.pick].thumb);
      Array.prototype.forEach.call(box.querySelectorAll('.imgcell'),function(c){c.classList.remove('on')});
      b.classList.add('on');
    }});
  }
  ov.querySelector('#ipSearch').onclick=function(){runSearch(false)};
  ov.querySelector('#ipShuffle').onclick=function(){runSearch(true)};
  ov.querySelector('#ipQ').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();runSearch(false)}};
  runSearch(false);

  ov.querySelector('#ipFile').onchange=function(){
    var f=this.files&&this.files[0]; if(!f)return;
    if(f.size>1024*1024){toast('File bari hai (max 1MB)');return}
    var rd=new FileReader();
    rd.onload=function(){setUrl(String(rd.result));toast('Image load done - Save Picture dabayein')};
    rd.readAsDataURL(f);
  };
  ov.querySelector('#ipClear').onclick=function(){
    var r=api('menu-item-image',{menu_item_id:id,image_url:''});

    if(!r.ok){this.disabled=false;this.textContent='Save Picture';toast(r.message||'Failed');return}
    p.img=url;ov.remove();renderGrid();toast('Picture saved');
  };
}

/* ============ NEW BILL FLOW (mode -> table / customer) ============ */
function newBillFlow(isEdit){
  var chosen=isEdit?mode:null;
  var ov=modal('<div class="dh"><h3>'+(isEdit?'Change Bill Context':'New Bill #'+billNo)+'</h3><p>Bill ki type select please</p></div>'
    +'<div class="db"><div id="nbStep1">'
      +'<div class="nbmodes">'
      +'<button class="nbm" data-m="Dine In"><b>&#127869; Dine In</b><small>Table par serve</small></button>'
      +'<button class="nbm" data-m="Takeaway"><b>&#128230; Takeaway</b><small>Counter pickup</small></button>'
      +'<button class="nbm" data-m="Home Delivery"><b>&#128663; Delivery</b><small>Customer address</small></button>'
      +'</div></div>'
      +'<div id="nbStep2" class="hide"></div></div>'
    +'<div class="df" id="nbFoot"><button class="sec" data-x id="nbCancel">Cancel (Esc)</button></div>',true);
  ov.id='nbOv';

  function tables(){
    var list=(BOOT.tables||[]);
    return list.length?list.map(function(t){
      var n=esc(t.display_name||t.name), busy=t.status==='OCCUPIED';
      return '<button class="tcard'+(busy?' busy':'')+'" data-t="'+n+'"><b>'+n+'</b><small>'+(busy?'Occupied':'Available')+(t.seats?(' &middot; '+t.seats+' seats'):'')+'</small></button>';
    }).join(''):'<div class="cempty">Koi table nahi &mdash; "+ New Table" se banayein</div>';
  }
  function custList(q){
    var list=(BOOT.customers||[]).filter(function(c){
      if(!q)return true;return (c.name+' '+(c.phone||'')).toLowerCase().indexOf(q.toLowerCase())>=0});
    return list.length?list.map(function(c){
      return '<div class="lrow"><div><b>'+esc(c.name)+'</b><small>'+esc(c.phone||'No phone')+(c.address?(' &middot; '+esc(c.address)):'')+'</small></div>'
        +'<button data-c="'+esc(c.id)+'">Select</button></div>'}).join(''):'<div class="cempty">Koi customer not found</div>';
  }
  function done(){
    billStarted=true;
    ov.remove();renderCtx();renderCart();
  }
  function step2(m){
    mode=m;
    var s2=ov.querySelector('#nbStep2'), s1=ov.querySelector('#nbStep1');
    if(m==='Takeaway'){ curTable='';curCustId='walkin';curCustName='Walk-in Customer';curCustPhone='';done();return }

        +'<div style="margin-top:10px"><button class="tb" id="nbNewTable">+ New Table</button></div>';

          curTable=this.dataset.t;curCustId='walkin';curCustName='Walk-in Customer';curCustPhone='';done()}});
      }
      bindT();
      s2.querySelector('#nbNewTable').onclick=function(){
        var n=prompt('New table name:','Table '+((BOOT.tables||[]).length+1));
        if(!n)return;
        var r=api('pos-table-create',{name:n.trim(),seats:4});
        if(!r.ok){toast(r.message||'Failed');return}
        var bb=api('pos-boot'); if(bb.ok)BOOT.tables=bb.boot.tables;
        s2.querySelector('#tg').innerHTML=tables();bindT();toast(n+' created');
      };
    }else{
      s2.innerHTML='<div class="clab">Select Customer</div>'
        +'<input class="inp" id="nbCq" placeholder="Search name / phone" style="margin-bottom:9px">'
        +'<div id="nbCl" style="max-height:38vh;overflow:auto">'+custList('')+'</div>'
        +'<div style="margin-top:10px"><button class="tb" id="nbNewCust">+ New Customer</button>'

/* ================= CART ================= */
function totals(){
  var sub=cart.reduce(function(a,l){return a+l.qty*l.price},0);
  var d=Math.min(disc.type==='percent'?sub*disc.value/100:disc.value,sub);
  var base=sub-d;
  var sv=svc.type==='percent'?base*svc.value/100:svc.value;
  var tax=(base+sv)*orderTax/100;
  return {sub:sub,disc:d,svc:sv,tax:tax,grand:base+sv+tax};
}
function renderCart(){
  var c=$('#cart');
  if(!cart.length)c.innerHTML='<div class="cempty">Your cart is empty<br>item par click karke add please</div>';
  else c.innerHTML=cart.map(function(l,i){
    return '<div class="ci" data-i="'+i+'" title="Click = quantity calculator">'
      +'<div class="cid"><b><span class="sn">'+(Number(i)+1)+'</span>'+esc(l.name)+'</b>'
      +'<small><span class="qx">'+qfmt(l.qty)+' x '+Math.round(l.price).toLocaleString()+'</span>'
      +(l.sentQty>0?'<span class="sent">sent: '+qfmt(l.sentQty)+'</span>':'')
      +(l.note?'<span class="nt">'+esc(l.note)+'</span>':'')+'</small></div>'
      +'<div class="cit"><span>'+money(l.qty*l.price)+'</span><button class="cix" data-cx="'+i+'">&times;</button></div></div>';
  }).join('');
  Array.prototype.forEach.call(c.querySelectorAll('[data-cx]'),function(b){b.onclick=function(e){e.stopPropagation();removeLine(b.dataset.cx)}});
  /* qty sirf calculator se badalti hai - poori row par click */
  Array.prototype.forEach.call(c.querySelectorAll('.ci'),function(row){row.onclick=function(e){
    if(e.target.closest('[data-cx]'))return;
    var i=row.dataset.i;
    calculator(cart[i].name,cart[i].qty,function(v){cart[i].qty=v;renderCart()});
  }});
  var t=totals();
  $('#tSub').textContent=money(t.sub);
  $('#tDisc').textContent='- '+money(t.disc);
  $('#tSvc').textContent=money(t.svc)+(svc.value&&svc.type==='percent'?' ('+svc.value+'%)':'');
  $('#tTax').textContent=money(t.tax)+' ('+orderTax+'% '+esc(payMethod)+')';
  $('#tGrand').textContent=money(t.grand);

  $('#kotBtn').disabled=!cart.some(function(l){return l.qty-l.sentQty>0});
  $('#chargeBtn').disabled=!cart.length;
  renderStrip();
}
/* kitchen-sent line ko manager approval ke baghair remove NahI kiya ja sakta */
function removeLine(i){
  var l=cart[i];
  if(!l)return;
  if(l.sentQty>0){voidApproval(l,function(){cart.splice(i,1);renderCart();toast('Item voided')});return}
  cart.splice(i,1);renderCart();
}
function voidApproval(line,ok){
  var ov=modal('<div class="dh"><h3>Void Approval Required</h3><p>Yeh item kitchen ja chuka hai &mdash; manager approval is required.</p></div>'
    +'<div class="db"><div class="kv"><span>Item</span><b>'+esc(line.name)+'</b></div>'
    +'<div class="kv"><span>Kitchen sent</span><b>'+qfmt(line.sentQty)+'</b></div>'
    +'<div class="box"><label class="f">Reason</label>'
    +'<select class="inp" id="vReason"><option>Customer cancelled</option><option>Wrong entry</option><option>Item unavailable</option><option>Quality issue</option><option>Other</option></select>'
    +'<label class="f" style="margin-top:9px">Note</label><input class="inp" id="vNote" placeholder="Optional">'
    +'<label class="f" style="margin-top:9px">Manager Password</label><input class="inp" id="vPass" type="password" placeholder="Admin / Owner / Manager ka password">'+'<div style="font-size:10.5px;color:var(--ink2);margin-top:6px">Manager password = Users &amp; Access mein banaye gaye kisi bhi Admin / Owner / Manager user ka apna login password.</div></div></div>'
    +'<div class="df"><button class="sec" data-x>Cancel</button><button class="go" id="vOk">Approve Void</button></div>');
  ov.querySelector('#vOk').onclick=function(){
    var pw=ov.querySelector('#vPass').value;
    if(!pw){toast('Manager password is required');return}
    this.disabled=true;this.textContent='Verifying...';
    /* server par verify: koi bhi Admin/Owner/Manager user ka password chalega */
    var v=api('pos-verify-manager',{password:pw});
    if(!v.ok){this.disabled=false;this.textContent='Approve Void';toast(v.message||'Incorrect manager password');return}
    var rec={bill:billNo,item:line.name,qty:line.sentQty,reason:ov.querySelector('#vReason').value,
      note:ov.querySelector('#vNote').value||'',approvedBy:v.manager,at:new Date().toLocaleString()};
    api('records-save',{module:'void_logs',data:rec});
    ov.remove();toast('Approved by '+v.manager);ok();
  };
}

/* ================= PAYLOAD / KOT / CHARGE ================= */
function payload(extra){
  var t=totals();
  var d={bill_no:billNo,service_mode:mode,table_name:mode==='Dine In'?curTable:'',
    customer_id:curCustId||'walkin',customer_name:curCustName||'Walk-in Customer',customer_phone:curCustPhone||'',
    shift_id:(shift&&shift.id)||'',discount_amount:t.disc,service_charge:t.svc,tax_amount:t.tax,
    items:cart.map(function(l){return {menu_item_id:l.id,base_name:l.name,name:l.name,qty:l.qty,unit_price:l.price,sent_qty:l.sentQty,note:l.note||''}})};
  if(extra)for(var k in extra)d[k]=extra[k];
  return d;
}
function syncBill(r){if(r&&r.bill_no&&r.bill_no!==billNo){billNo=r.bill_no;toast('Server ne bill #'+billNo+' assign kiya')}}

function sendKot(autoPrint){
  if(!shift){openGate();return}
  /* DELTA: sirf wo qty jo pehle kitchen NahI gayi */
  var delta=cart.filter(function(l){return l.qty-l.sentQty>0})
    .map(function(l){return {id:l.id,name:l.name,qty:l.qty-l.sentQty,price:l.price,note:l.note||''}});
  if(!delta.length){toast('Nothing new to send to the kitchen');return}
  /* RUNNING = is bill ka kuch pehle hi kitchen ja chuka hai (mark karne se PEHLE dekho) */
  var wasRunning=cart.some(function(l){return l.sentQty>0});
  var r=api('pos-kot',payload());
  if(!r.ok){toast(r.message||'KOT save nahi hua - kitchen ko NahI gaya');return}
  syncBill(r);
  cart.forEach(function(l){l.sentQty=l.qty});
  renderCart();
  var kinfo={running:wasRunning};
  if(autoPrint)printNode(slipNode('KOT',delta,kinfo));
  else slipPreview('KOT',delta,kinfo);
  toast('KOT sent - sirf naye '+delta.length+' item(s)');
}
$('#kotBtn').onclick=function(){sendKot(true)};

$('#chargeBtn').onclick=function(){
  if(!shift){openGate();return}
  var pay='Cash'; payMethod=pay; orderTax=taxPct(pay);
  var t=totals();
  var ov=modal('<div class="dh"><h3>Payment &mdash; Bill #'+billNo+'</h3><p>'+esc(mode)+' &middot; '+cart.length+' line(s)</p></div>'
    +'<div class="db"><div class="ptot"><span>TOTAL AMOUNT</span><b id="ptotAmt">'+money(t.grand)+'</b>'
    +'<small id="ptotSub">Subtotal '+money(t.sub)+'</small></div>'
    +'<label class="f">Payment Method</label><div class="pmg">'
    +['Cash','Card','Raast','Easypaisa','JazzCash','Bank'].map(function(m,i){return '<button class="'+(i===0?'on':'')+'" data-pm="'+m+'">'+m+'</button>'}).join('')
    +'</div><label class="f">Received Amount</label><input class="inp" id="rcv" type="number" inputmode="decimal" value="'+Math.round(t.grand)+'" style="font-size:16px;font-weight:800">'
    +'<div class="qv" style="grid-template-columns:repeat(4,1fr);margin-top:8px">'
    +[500,1000,2000,5000].map(function(v){return '<button data-cash="'+v+'">'+v+'</button>'}).join('')+'</div>'
    +'<div class="chgbox" style="margin-top:11px"><span>Change to return</span><b id="chg">PKR 0</b></div>'
    +'<div class="qv" style="grid-template-columns:repeat(3,1fr);margin-top:4px">'
      +'<button id="cmHold">Hold Bill</button><button id="cmPrev">Preview / Print</button><button id="cmWa">WhatsApp</button></div>'
    +'</div>'
    +'<div class="df"><button class="sec" data-x>Cancel (Esc)</button><button class="go" id="doPay">Complete Payment</button></div>');
  ov.querySelector('#cmHold').onclick=function(){ov.remove();holdCurrent()};
  ov.querySelector('#cmPrev').onclick=function(){slipPreview('BILL',cart.slice())};
  ov.querySelector('#cmWa').onclick=function(){waSend('BILL',cart.slice())};
  function refreshTot(){
    orderTax=taxPct(pay); t=totals(); renderCart();
    ov.querySelector('#ptotAmt').textContent=money(t.grand);
    ov.querySelector('#ptotSub').innerHTML='Subtotal '+money(t.sub)+(t.disc?' &middot; Disc -'+money(t.disc):'')
      +(t.svc?' &middot; Svc '+money(t.svc):'')+' &middot; Tax '+orderTax+'% ('+(orderTax===SET.tax_card?'card/online':'cash')+') '+money(t.tax);
    chg();
  }
  Array.prototype.forEach.call(ov.querySelectorAll('[data-pm]'),function(b){b.onclick=function(){
    Array.prototype.forEach.call(ov.querySelectorAll('[data-pm]'),function(o){o.classList.remove('on')});
    this.classList.add('on');pay=this.dataset.pm;payMethod=pay;refreshTot();
  }});
  function chg(){var v=Number(ov.querySelector('#rcv').value||0);ov.querySelector('#chg').textContent=money(Math.max(0,v-t.grand))}
  Array.prototype.forEach.call(ov.querySelectorAll('[data-cash]'),function(b){b.onclick=function(){
    ov.querySelector('#rcv').value=Number(ov.querySelector('#rcv').value||0)+Number(this.dataset.cash);chg();
  }});
  var rcvEl=ov.querySelector('#rcv');
  rcvEl.oninput=chg;
  refreshTot();
  /* received amount par foran focus (aapki demand) */
  setTimeout(function(){rcvEl.focus();rcvEl.select()},60);
  function pay_now(btn){
    var rcv=Number(rcvEl.value||0);
    if(rcv<t.grand-0.5){toast('Received amount kam hai');rcvEl.focus();return}
    if(btn){btn.disabled=true;btn.textContent='Saving...'}
    var r=api('pos-finalize',payload({payment_code:pay,received_amount:rcv}));
    if(!r.ok){if(btn){btn.disabled=false;btn.textContent='Complete Payment'}toast(r.message||'Bill save nahi hua');return}
    ov.remove();
    if(curHoldId){api('records-delete',{module:HOLD,id:curHoldId});curHoldId='';loadHolds();}
    /* fbr_no server se aata hai (pos-finalize ka jawab). QR isi ka banta
       hai; na mile to purana fallback payload chalta hai. */
    var info={billNo:r.bill_no||billNo,mode:mode,table:curTable,t:t,pay:pay,rcv:rcv,
              fbrNo:(r.fbr_no||''),fiscal:(r.fiscal||null),at:new Date().toLocaleString()};
    if(r.fiscal&&r.fiscal.status&&r.fiscal.status!=='SENT'&&r.fiscal.status!=='NONE'){
      /* FBR tak nahi pohancha - user ko USI WAQT pata chale, mahine baad nahi. */
      toast('Bill completed, but FBR is pending: '+(r.fiscal.message||r.fiscal.status),true);
    }
    lastBill=info;
    /* AUTO PRINT + background par naya bill */
    printNode(slipNode('BILL',cart.slice(),info));
    toast('Bill #'+info.billNo+' complete - '+money(t.grand));
    newBill(r.next);
  }
  ov.querySelector('#doPay').onclick=function(){pay_now(this)};
  /* Enter = complete payment + print + new bill */
  rcvEl.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();pay_now(ov.querySelector('#doPay'))}};
};

/* ================= SLIP / PRINT ================= */
function slipHtml(kind,lines,info){
  var t=(info&&info.t)||totals();
  var head;
  if(kind==='KOT'){
    /* SIMPLE KOT: restaurant detail nahi. Sirf type, new/running, time, items. */
    var isRunning=info&&typeof info.running!=='undefined'?!!info.running:cart.some(function(l){return l.sentQty>0});
    head='<div class="kotType">'+esc(((info&&info.mode)||mode).toUpperCase())
      +((info&&info.table)||curTable?(' - '+esc((info&&info.table)||curTable)):'')+'</div>'
      +'<div class="kotTag">'+(isRunning?'RUNNING ORDER':'NEW ORDER')+'</div>'
      +'<div class="c">Bill #'+esc((info&&info.billNo)||billNo)+'</div>'
      +'<div class="c">'+esc(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))
      +' &middot; '+esc(new Date().toLocaleDateString())+'</div><hr>';
  }else{
    /* V75 — pehli line BUSINESS ka naam hoti hai, branch ka nahi.
       Pehle yahan `BOOT.site.name` tha — wo branch hai — is liye bill
       address se shuru hota tha aur business ka naam kahin nahi aata tha.
       Baqi tafseel Settings se (wahi jo bill template use karta hai). */
    var ST=(window.__BILLSET||{});
    var bizName=ST.business_name||(BOOT.brand&&BOOT.brand.name)||(BOOT.site&&BOOT.site.name)||'Restaurant';
    var brName =ST.branch_name||(BOOT.site&&BOOT.site.name)||'';
    head='<h4>'+esc(bizName)+'</h4>'
      +(brName&&brName!==bizName?'<div class="c">'+esc(brName)+'</div>':'')
      +(ST.address?'<div class="c">'+esc(ST.address)+'</div>':'')
      +(ST.phone?'<div class="c">Ph: '+esc(ST.phone)+'</div>':'')
      +(ST.ntn?'<div class="c">NTN: '+esc(ST.ntn)+'</div>':'')
      +(ST.receipt_header?'<div class="c">'+esc(ST.receipt_header)+'</div>':'')
      +'<div class="c">SALES INVOICE</div>'
      +'<div class="c">Bill #'+esc((info&&info.billNo)||billNo)+' &middot; '+esc((info&&info.mode)||mode)
      +((info&&info.table)||curTable?(' &middot; '+esc((info&&info.table)||curTable)):'')+'</div>'
      +'<div class="c">'+esc((info&&info.at)||new Date().toLocaleString())+'</div><hr>';
  }
  var rows=lines.map(function(l){
    return kind==='KOT'
      ? '<tr><td class="kq">'+qfmt(l.qty)+'</td><td class="kn">'+esc(l.name)+(l.note?'<br><i>'+esc(l.note)+'</i>':'')+'</td></tr>'
      : '<tr><td>'+qfmt(l.qty)+' x</td><td>'+esc(l.name)+(l.note?'<br><i style="font-size:9px">'+esc(l.note)+'</i>':'')+'</td><td class="r">'+money(l.qty*l.price)+'</td></tr>';
  }).join('');
  /* Pehle QR fail hone is missing the `this.remove()` tha - QR khamoshi se gayab.
     FBR ke bill par yeh na-qabil-e-qabool hai; ab wajah likhi aati hai. */
  /* ---------- Connect a tablet (V68) ----------
     Waiter ke tablet ko jorne ka poora tareeqa ek screen par: is PC ka
     LAN address, QR, aur 15 minute ka code. QR isi computer par banta
     hai (Qr.php) — internet ki zaroorat nahi. */
  var tb=document.getElementById('tabletBtn');
  if(tb) tb.onclick=function(){
    var r=DBApi.req('tablet-connect',{role:'WAITER'});
    if(!r||!r.ok){ toast((r&&r.message)||'Could not start tablet pairing',true); return; }
    var ov=document.createElement('div');
    ov.setAttribute('style','position:fixed;inset:0;background:rgba(21,34,27,.55);z-index:9999;'
      +'display:grid;place-items:center;padding:20px');
    ov.innerHTML='<div style="background:#fff;border-radius:18px;max-width:430px;width:100%;'
      +'padding:26px 24px;text-align:center;box-shadow:0 20px 60px rgba(21,34,27,.25)">'
      +'<h2 style="margin:0 0 4px;font-size:18px">Connect a tablet</h2>'
      +'<p style="margin:0 0 16px;font-size:12.5px;color:#5f6f66">'
        +'On the tablet, connect to the same WiFi and scan this code.</p>'
      +'<img src="/api.php?action=qr&scale=6&data='+encodeURIComponent(r.pair_url)+'" '
        +'style="width:220px;height:220px;border:1px solid #e1e9e4;border-radius:12px" alt="" onerror="qrFail(this)">'
      +'<p style="margin:14px 0 4px;font-size:12px;color:#5f6f66">Or open this address on the tablet</p>'
      +'<div style="font-size:15px;font-weight:800;letter-spacing:.02em">'+esc(r.url)+'</div>'
      +'<p style="margin:12px 0 0;font-size:11.5px;color:#8b9a92">'
        +'This code works for '+esc(String(r.expires_minutes))+' minutes. '
        +'The tablet stops working when this POS computer is switched off.</p>'
      +'<button class="tb" id="tabClose" style="margin-top:16px;width:100%">Done</button>'
      +'</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click',function(e){
      if(e.target===ov||e.target.id==='tabClose') ov.remove();
    });
  };

  /* ---------- Licence banner (V65) ----------
     POS shell.js use nahi karta, is liye yahan alag se. Cashier ko
     3 din pehle pata chalna is required, aur expire hone par Wabwar ka
     number saamne ho taake seedha call kar ke renew karwa le. */
  (function(){
    try{
      var r=DBApi.req('licence-status');
      if(!r||!r.ok||!r.licence)return;
      var L=r.licence, bar=document.getElementById('licBar');
      if(!bar||(!L.expired&&!L.warn))return;
      var v=L.vendor||{}, tel=(v.phone||'').replace(/\s/g,'');
      bar.setAttribute('style','padding:9px 14px;font-size:13px;display:flex;gap:10px;'
        +'align-items:center;flex-wrap:wrap;'
        +(L.expired?'background:#fdecee;color:#a3222d;border-bottom:1px solid #f3c3c7'
                   :'background:#fff6e5;color:#8a5a00;border-bottom:1px solid #f0d9a8'));
      bar.innerHTML='<b>'+esc(L.message||'')+'</b>'
        /* Cashier ko sirf number dena kaafi nahi — malik khud renew kar
           sake, is liye seedha activation screen ka link. */
        /* Renew malik/manager ka kaam hai — cashier ko link dikha kar
           permission denied par bhejna be-maani hai. Usay sirf number. */
        +((CAN&&CAN.manage)?('<a class="tb" href="/activate.html">'+(L.expired?'Activate now':'Renew')+'</a>'):'')
        +(L.expired?('<a class="tb" href="tel:'+esc(tel)+'">Call '+esc(v.phone||'')+'</a>'):'');
    }catch(e){}
  })();

  window.qrFail=function(img){
    img.style.display='none';
    var d=document.createElement('div');
    d.style.fontSize='9px'; d.textContent='QR could not be generated';
    if(img.parentNode)img.parentNode.insertBefore(d,img.nextSibling);
  };
  var fbrQr='';
  if(kind!=='KOT'&&PRINT.qr){
    /* Asli FBR invoice number, warna QR mein banaya hua matn jata tha
       jise FBR ka koi scanner pehchanta hi nahi. */
    var payload=(info&&info.fbrNo)?info.fbrNo
              :('INV:'+((info&&info.billNo)||billNo)+'|AMT:'+Math.round(t.grand)+'|TAX:'+Math.round(t.tax));
    fbrQr='<hr><div class="c"><img src="/api.php?action=qr&scale=3&data='+encodeURIComponent(payload)
      +'" style="width:96px;height:96px" onerror="qrFail(this)"><div style="font-size:9px">FBR Invoice QR</div></div>';
  }
  var foot=kind==='KOT'?'<hr>'
    :'<hr><table>'
      +'<tr><td>Subtotal</td><td class="r">'+money(t.sub)+'</td></tr>'
      +(t.disc?'<tr><td>Discount</td><td class="r">-'+money(t.disc)+'</td></tr>':'')
      +(t.svc?'<tr><td>Service Charge</td><td class="r">'+money(t.svc)+'</td></tr>':'')
      +(t.tax?'<tr><td>Sales Tax</td><td class="r">'+money(t.tax)+'</td></tr>':'')
      +'<tr><td><b>GRAND TOTAL</b></td><td class="r"><b>'+money(t.grand)+'</b></td></tr>'
      +(info?'<tr><td>Paid ('+esc(info.pay)+')</td><td class="r">'+money(info.rcv)+'</td></tr>'
        +'<tr><td>Change</td><td class="r">'+money(Math.max(0,info.rcv-t.grand))+'</td></tr>':'')
      +'</table>'+fbrQr+'<hr><div class="c">'+esc(PRINT.footer||'Thank you! Visit again.')+'</div>';
  return '<div class="slip">'+head+'<table>'+rows+'</table>'+foot+'</div>';
}
function slipNode(kind,lines,info){
  var d=document.createElement('div');
  d.innerHTML=slipHtml(kind,lines,info);
  return d;
}
function slipPreview(kind,lines,info){
  if(!lines||!lines.length){toast('Nothing to print');return}
  var ov=modal('<div class="dh"><h3>'+(kind==='KOT'?'Kitchen Ticket':'Bill')+' Preview</h3><p>Print ya WhatsApp par bhejein.</p></div>'
    +'<div class="db" id="slipBody">'+slipHtml(kind,lines,info)+'</div>'
    +'<div class="df"><button class="sec" data-x>Close</button><button class="sec" id="slipWa">WhatsApp</button><button class="go" id="slipPrint">Print</button></div>');
  ov.querySelector('#slipPrint').onclick=function(){printNode(ov.querySelector('#slipBody'))};
  ov.querySelector('#slipWa').onclick=function(){waSend(kind,lines,info)};
}
/* print: DOM API se — kisi bhi HTML document ko string mein NAHI banate */
function printNode(node,wide){
  var w=window.open('','_blank','width=380,height=640');
  if(!w){toast('Popup block done - allow please');return}
  var d=w.document;
  d.title='Print';
  var mm=(PRINT.size||80)+'mm';
  var st=d.createElement('style');
  st.textContent='body{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:10px;margin:0}'
    +'table{width:100%;border-collapse:collapse}td{padding:2px 0;vertical-align:top}.r{text-align:right}'
    +'h4{text-align:center;font-size:13px;margin:0 0 2px}.c{text-align:center;font-size:10px;color:#555}'
    +'hr{border:0;border-top:1px dashed #999;margin:7px 0}.slip{border:0;padding:0}'
    +'@page{size:'+(wide?'auto':mm+' auto')+';margin:'+(wide?'8mm':'2mm')+'}'
    +(wide?'':'body{width:'+mm+'}')
    +'.kotType{text-align:center;font-size:16px;font-weight:800;letter-spacing:1px}'
    +'.kotTag{text-align:center;font-size:12px;font-weight:800;margin:3px 0 4px;border:2px solid #000;padding:2px}'
    +'.kq{font-size:16px;font-weight:800;width:42px}.kn{font-size:14px;font-weight:700;padding-bottom:6px}.kn i{font-size:11px}';
  d.head.appendChild(st);
  var wrap=d.createElement('div');
  wrap.innerHTML=node.innerHTML;
  d.body.appendChild(wrap);
  w.focus();w.print();
}
function waSend(kind,lines,info){
  var cust={phone:curCustPhone};
  var billForPdf=(info&&info.billNo)||billNo;
  var ov=modal('<div class="dh"><h3>Send on WhatsApp</h3><p>Bill summary customer ko bhejein.</p></div>'
    +'<div class="db"><label class="f">Phone (with country code)</label>'
    +'<input class="inp" id="waNo" value="'+esc((cust.phone||'').replace(/[^0-9]/g,'')||'92')+'">'
    +'<div class="box"><b style="font-size:11.5px">Bill PDF</b>'
    +'<div style="font-size:11px;color:var(--ink2);margin:5px 0 8px">Proper PDF invoice server par generate hoti hai. Apni WhatsApp API isi link ko attachment ke tor par bhej sakti hai.</div>'
    +'<div class="selrow"><input class="inp" id="waPdf" readonly value="'+esc(location.origin+'/api.php?action=bill-pdf&bill='+billForPdf)+'">'
    +'<button class="tb" id="waCopy" style="flex:none">Copy</button>'
    +'<button class="tb" id="waOpen" style="flex:none">Open PDF</button></div></div></div>'
    +'<div class="df"><button class="sec" data-x>Cancel (Esc)</button><button class="go" id="waGo">Open WhatsApp</button></div>');
  ov.querySelector('#waCopy').onclick=function(){
    var el=ov.querySelector('#waPdf');el.select();
    if(navigator.clipboard)navigator.clipboard.writeText(el.value);
    toast('PDF link copy done');
  };
  ov.querySelector('#waOpen').onclick=function(){window.open(ov.querySelector('#waPdf').value,'_blank')};
  ov.querySelector('#waGo').onclick=function(){
    var t=(info&&info.t)||totals();
    var txt=((BOOT.site&&BOOT.site.name)||'Urban Spoon')+'\n'+(kind==='KOT'?'Kitchen Ticket':'Invoice')+' #'+billForPdf+'\n'
      +lines.map(function(l){return qfmt(l.qty)+' x '+l.name+' = '+money(l.qty*l.price)}).join('\n')
      +'\nTotal: '+money(t.grand)+'\nPDF: '+ov.querySelector('#waPdf').value+'\nShukriya!';
    var no=(ov.querySelector('#waNo').value||'').replace(/[^0-9]/g,'');
    window.open('https://wa.me/'+no+'?text='+encodeURIComponent(txt),'_blank');
    ov.remove();
  };
}

/* ================= NEW BILL / HOLDS / DUPLICATE ================= */
function newBill(next,skipFlow){
  cart=[];disc={type:'flat',value:0};preQty={};
  if(!next){var n=api('pos-next-bill');next=n.ok?n.next:1}
  billNo=String(next||1).padStart(4,'0');
  curTable='';curCustId='walkin';curCustName='Walk-in Customer';curCustPhone='';curHoldId='';
  mode='Dine In';orderTax=taxPct('Cash');payMethod='Cash';billStarted=false;
  renderCart();
  if(!skipFlow)newBillFlow();
}
/* New Bill: mojooda cart apne aap HOLD ho jata hai (alag button zaroori nahi) */
function onNewBill(){
  if(!shift){openGate();return}
  if(cart.length){
    if(holdCurrent(true))toast('Purana bill hold done');
    else return;
  }else newBill();
}
function loadHolds(){
  var r=api('records-list&module='+HOLD);
  holds=(r.ok&&r.rows)?r.rows:[];
  $('#holdCount').textContent='('+holds.length+')';
}
function holdCurrent(silent){
  if(!cart.length){if(!silent)toast('Your cart is empty');return false}
  var t=totals();
  var d={billNo:billNo,mode:mode,table:curTable,total:t.grand,lines:cart.length,
    at:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
    cart:JSON.stringify(cart),cust:curCustId,custName:curCustName,custPhone:curCustPhone};
  if(curHoldId)d.id=curHoldId;      /* wahi record update ho, naya na bane */
  var r=api('records-save',{module:HOLD,data:d});
  if(!r.ok){toast(r.message||'Hold failed');return false}
  loadHolds();newBill();
  if(!silent)toast('Bill hold kar diya');
  return true;
}
$('#holdsBtn').onclick=function(){
  loadHolds();
  var body=holds.length?holds.map(function(h,i){
    return '<div class="lrow"><div><b>Bill #'+esc(h.billNo)+' &middot; '+esc(h.table||h.mode)+'</b>'
      +'<small>'+(h.lines||0)+' items &middot; '+money(h.total||0)+' &middot; '+esc(h.at||'')+'</small></div>'
      +'<button data-res="'+i+'">Resume</button></div>';
  }).join(''):'<div class="cempty">Koi held bill nahi</div>';
  var ov=modal('<div class="dh"><h3>Held Bills</h3><p>Rukay hue orders resume please</p></div><div class="db">'+body+'</div>'
    +'<div class="df"><button class="sec" data-x>Close</button>'+(cart.length?'<button class="go" id="hNow">Hold Current Bill</button>':'')+'</div>',true);
  var hb=ov.querySelector('#hNow'); if(hb)hb.onclick=function(){if(holdCurrent())ov.remove()};
  Array.prototype.forEach.call(ov.querySelectorAll('[data-res]'),function(b){b.onclick=function(){
    var h=holds[this.dataset.res];
    curHoldId=h.id;                 /* hold record zinda rehta hai jab tak bill clear na ho */
    try{cart=JSON.parse(h.cart||'[]')}catch(e){cart=[]}
    billNo=h.billNo;mode=h.mode||'Dine In';curTable=h.table||'';
    curCustId=h.cust||'walkin';curCustName=h.custName||'Walk-in Customer';curCustPhone=h.custPhone||'';
    billStarted=true;
    ov.remove();loadHolds();renderCart();toast('Bill #'+billNo+' resumed (hold list mein maujood rahega)');
  }});
};
$('#dupBtn').onclick=function(){
  var bills=(BOOT.shiftBills||[]);
  var body=bills.length?bills.map(function(b,i){
    return '<div class="lrow"><div><b>Bill #'+esc(b.billNo)+' &middot; '+esc(b.mode)+'</b>'
      +'<small>'+esc(b.time)+' &middot; '+esc(b.customer)+' &middot; '+money(b.amount)+' &middot; '+esc(b.payment||'')+'</small></div>'
      +'<button data-dup="'+i+'">Reprint</button></div>';
  }).join(''):'<div class="cempty">Aaj koi closed bill nahi</div>';
  var ov=modal('<div class="dh"><h3>Duplicate Bill</h3><p>Aaj ke closed bills &mdash; reprint please</p></div>'
    +'<div class="db"><input class="inp" id="dupQ" placeholder="Search bill no / customer" style="margin-bottom:10px">'
    +'<div id="dupList">'+body+'</div></div><div class="df"><button class="sec" data-x>Close</button></div>',true);
  function bind(){
    Array.prototype.forEach.call(ov.querySelectorAll('[data-dup]'),function(b){b.onclick=function(){
      var x=bills[this.dataset.dup];
      slipPreview('BILL',[{name:'Bill total',qty:1,price:x.amount,note:''}],
        {billNo:x.billNo,mode:x.mode,table:x.table,at:x.time,pay:x.payment,rcv:x.amount,
         t:{sub:x.amount,disc:0,svc:0,tax:0,grand:x.amount}});
    }});
  }
  bind();
  ov.querySelector('#dupQ').oninput=function(){
    var s=this.value.toLowerCase();
    var f=bills.map(function(b,i){return {b:b,i:i}}).filter(function(o){
      return (String(o.b.billNo)+' '+o.b.customer).toLowerCase().indexOf(s)>=0});
    ov.querySelector('#dupList').innerHTML=f.length?f.map(function(o){
      return '<div class="lrow"><div><b>Bill #'+esc(o.b.billNo)+'</b><small>'+esc(o.b.time)+' &middot; '+money(o.b.amount)+'</small></div>'
        +'<button data-dup="'+o.i+'">Reprint</button></div>'}).join(''):'<div class="cempty">Koi bill not found</div>';
    bind();
  };
};

  if(!CAN.manage){toast('Only an Admin or Manager can change items or rates');return}
  openItemModal('item');
};
function openItemModal(startTab){
  var tab=startTab||'item', inv=[];
  var sr=api('store-state'); if(sr.ok&&sr.state)inv=sr.state.inventoryItems||[];
  var cats=(BOOT.categories||[]).map(function(c){return c.name});
  var ov=modal('<div class="dh"><h3>Item Management</h3><p>Item banayein, category add please, ya rate change please</p></div>'
    +'<div class="tabs"><button class="tab" data-t="item">Create Item</button><button class="tab" data-t="category">Create Category</button><button class="tab" data-t="rate">Change Rate</button></div>'
    +'<div class="db">'
    +'<div data-p="item"><div class="fg">'
      +'<div class="full"><label class="f">Item Name *</label><input class="inp" id="iName" placeholder="Chicken Karahi"></div>'
      +'<div><label class="f">Selling Price *</label><input class="inp" id="iPrice" type="number" placeholder="1400"></div>'
      +'<div><label class="f">Category</label><select class="inp" id="iCat">'+(cats.length?cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join(''):'<option>General</option>')+'</select></div>'
      +'<div><label class="f">Type</label><select class="inp" id="iType"><option value="standard">Standard</option><option value="weighted">Weighted (per KG)</option><option value="configurable">Variants (sizes)</option></select></div>'
      +'<div><label class="f">Description</label><input class="inp" id="iDesc" placeholder="Optional"></div>'
      +'<div class="full hide" id="iVarWrap"><label class="f">Variants &mdash; Name:Price, comma separated</label><input class="inp" id="iVars" placeholder="Small:900, Large:1500"></div></div>'
      +'<div class="box"><label class="f" style="margin-bottom:8px">Inventory Link (stock deduction)</label><div class="fg">'
        +'<div><label class="f">Mode</label><select class="inp" id="iMode"><option value="none">No inventory link</option><option value="existing">Deduct existing item</option><option value="new">Create new inventory item</option></select></div>'
        +'<div class="hide" id="iQtyW"><label class="f">Deduct qty / sale</label><input class="inp" id="iQty" type="number" step="0.001" value="1"></div>'
        +'<div class="full hide" id="iExW"><label class="f">Inventory item</label><select class="inp" id="iEx">'+(inv.length?inv.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.name)+' - '+(Math.round((x.stockQty||0)*100)/100)+' '+esc(x.stockUnit||'')+'</option>'}).join(''):'<option value="">(koi inventory item nahi)</option>')+'</select></div>'
        +'<div class="hide" id="iNnW"><label class="f">New inventory name</label><input class="inp" id="iNn" placeholder="Same as item"></div>'
        +'<div class="hide" id="iNuW"><label class="f">Stock unit</label><select class="inp" id="iNu"><option>PCS</option><option>G</option><option>KG</option><option>ML</option><option>L</option></select></div>'
        +'<div class="hide" id="iNoW"><label class="f">Opening stock</label><input class="inp" id="iNo" type="number" step="0.001" value="0"></div>'
        +'<div class="hide" id="iNcW"><label class="f">Cost per unit</label><input class="inp" id="iNc" type="number" step="0.01" value="0"></div>'
      +'</div></div></div>'
    +'<div data-p="category" class="hide"><div class="fg">'
      +'<div><label class="f">Category Name *</label><input class="inp" id="cName" placeholder="Beverages"></div>'
      +'<div><label class="f">Icon</label><input class="inp" id="cIcon" value="*"></div>'
      +'<div class="full"><label class="f">Kitchen Printer Station</label><input class="inp" id="cPrn" value="main"></div></div></div>'
    +'<div data-p="rate" class="hide"><div class="fg">'
      +'<div class="full"><label class="f">Item</label><select class="inp" id="rSel">'+(BOOT.products.length?BOOT.products.map(function(p){return '<option value="'+esc(p.id)+'" data-pr="'+p.price+'">'+esc(p.name)+' - '+money(p.price)+'</option>'}).join(''):'<option value="">(koi item nahi)</option>')+'</select></div>'
      +'<div><label class="f">Current Rate</label><input class="inp" id="rCur" disabled></div>'
      +'<div><label class="f">New Rate *</label><input class="inp" id="rNew" type="number"></div></div></div>'
    +'</div><div class="df"><button class="sec" data-x>Cancel</button><button class="go" id="saveIt">Save</button></div>',true);

  function setTab(t){tab=t;
    Array.prototype.forEach.call(ov.querySelectorAll('[data-t]'),function(b){b.classList.toggle('on',b.dataset.t===t)});
    Array.prototype.forEach.call(ov.querySelectorAll('[data-p]'),function(p){p.classList.toggle('hide',p.dataset.p!==t)});
  }
  Array.prototype.forEach.call(ov.querySelectorAll('[data-t]'),function(b){b.onclick=function(){setTab(this.dataset.t)}});
  setTab(tab);
  ov.querySelector('#iType').onchange=function(){ov.querySelector('#iVarWrap').classList.toggle('hide',this.value!=='configurable')};
  ov.querySelector('#iMode').onchange=function(){
    var m=this.value;
    ov.querySelector('#iQtyW').classList.toggle('hide',m==='none');
    ov.querySelector('#iExW').classList.toggle('hide',m!=='existing');
    ['iNnW','iNuW','iNoW','iNcW'].forEach(function(id){ov.querySelector('#'+id).classList.toggle('hide',m!=='new')});
  };
  function syncRate(){var s=ov.querySelector('#rSel'),o=s&&s.options[s.selectedIndex];if(o&&o.dataset.pr)ov.querySelector('#rCur').value=money(o.dataset.pr)}
  if(ov.querySelector('#rSel')){ov.querySelector('#rSel').onchange=syncRate;syncRate()}

  ov.querySelector('#saveIt').onclick=function(){
    var btn=this;btn.disabled=true;btn.textContent='Saving...';
    function bad(m){btn.disabled=false;btn.textContent='Save';toast(m)}
    var r;
    if(tab==='item'){
      var d={name:(ov.querySelector('#iName').value||'').trim(),price:Number(ov.querySelector('#iPrice').value||0),
        category:ov.querySelector('#iCat').value,type:ov.querySelector('#iType').value,desc:(ov.querySelector('#iDesc').value||'').trim()};
      if(!d.name||d.price<=0){bad('Item name aur valid price is required');return}
      if(d.type==='configurable'){
        d.variants=(ov.querySelector('#iVars').value||'').split(',').map(function(s){
          var q=s.split(':');return {name:(q[0]||'').trim(),price:Number(q[1]||0)}}).filter(function(v){return v.name&&v.price>0});
      }
      var m=ov.querySelector('#iMode').value;
      if(m==='existing')d.inventory={mode:'existing',item_id:ov.querySelector('#iEx').value,qty:Number(ov.querySelector('#iQty').value||1)};
      else if(m==='new')d.inventory={mode:'new',name:(ov.querySelector('#iNn').value||'').trim()||d.name,unit:ov.querySelector('#iNu').value,
        opening_qty:Number(ov.querySelector('#iNo').value||0),cost:Number(ov.querySelector('#iNc').value||0),qty:Number(ov.querySelector('#iQty').value||1)};
      else d.inventory={mode:'none'};
      r=api('pos-quick-item',d);
      if(r.ok)toast(d.name+' saved'+(r.inventory_item_id?' + inventory linked':''));
    }else if(tab==='category'){
      var nm=(ov.querySelector('#cName').value||'').trim();
      if(!nm){bad('Category name is required');return}
      r=api('menu-category-create',{name:nm,icon:(ov.querySelector('#cIcon').value||'').trim(),printer:(ov.querySelector('#cPrn').value||'').trim()});
      if(r.ok)toast('Category "'+nm+'" saved');
    }else{
      var id=ov.querySelector('#rSel').value,nr=Number(ov.querySelector('#rNew').value||0);
      if(!id||nr<=0){bad('Item aur valid rate select please');return}
      r=api('menu-item-rate',{menu_item_id:id,price:nr});
      if(r.ok)toast('Rate updated: '+money(nr));
    }
    if(!r.ok){bad(r.message||'Save failed');return}
    ov.remove();boot();
  };
}

            if(c.ok)el.textContent='Cash cleared. Ab shift open please.';

function modal(html,wide,noClose){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="dlg'+(wide?' wide':'')+'">'+html+'</div>';
  document.body.appendChild(ov);
  Array.prototype.forEach.call(ov.querySelectorAll('[data-x]'),function(b){b.onclick=function(){closeModal(ov)}});
  if(!noClose)ov.onclick=function(e){if(e.target===ov)closeModal(ov)};
  return ov;
}
function closeModal(ov){ if(ov&&ov.parentNode)ov.remove(); }
/* ESC: sab se upar wala popup band (shift gate ke ilawa - wo lazmi hai) */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  var all=document.querySelectorAll('.ov');
  if(!all.length)return;
  var top=all[all.length-1];
  if(top.id==='gateOv')return;           /* shift gate band nahi hoti */
  e.preventDefault();closeModal(top);
});
$('#q').oninput=function(){search=this.value;renderGrid()};
/* Logo: admin/manager -> Dashboard; cashier -> apni shift detail (reports nahi) */
$('#homeBtn').onclick=function(){
  var role=((BOOT.cashier&&BOOT.cashier.role)||'').toLowerCase();
  if(role.indexOf('cashier')>=0){myShift();return}
  location.href='/index.html';
};
function myShift(){
  var pr=shift?api('shift-preview'):api('shift-last-report');
  if(!pr.ok){toast(pr.message||'Koi shift record nahi');return}
  var ov=modal('<div class="dh"><h3>'+(shift?'Current Shift':'Last Closed Shift')+'</h3><p>Opening / closing reconciliation</p></div>'
    +'<div class="db" id="msBody">'+repRows(pr.report)+'</div>'
    +'<div class="df"><button class="sec" data-x>Close (Esc)</button><button class="sec" id="msPrint">Print</button>'
    +(shift?'<button class="go" id="msClose">Close Shift</button>':'')+'</div>');
  ov.querySelector('#msPrint').onclick=function(){printNode(ov.querySelector('#msBody'))};
  var cb=ov.querySelector('#msClose'); if(cb)cb.onclick=function(){ov.remove();closeShift()};
}
document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
  if(e.key==='F1'){e.preventDefault();onNewBill()}
  if(e.key==='F2'){e.preventDefault();if(!$('#kotBtn').disabled)$('#kotBtn').click()}
  if(e.key==='F3'){e.preventDefault();if(!$('#chargeBtn').disabled)$('#chargeBtn').click()}
});
boot();
</script>
</body>
</html>
