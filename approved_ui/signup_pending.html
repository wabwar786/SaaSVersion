<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urban Spoon · Request submitted</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="auth.css">
<style>
.pending-center{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fdece9,#f5f4f1)}
.pending-card{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px;text-align:center;box-shadow:var(--sh)}
.pending-ico{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-size:34px}
.pending-card h2{font-family:var(--display);font-size:24px;margin:0}
.pending-card>p{color:var(--muted);font-size:13px;margin:8px 0 18px;line-height:1.6}
.req-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px;line-height:1.8;text-align:left}
</style>
</head>
<body>
<div class="pending-center">
  <div class="pending-card">
    <div class="pending-ico">⏳</div>
    <h2>Request submitted</h2>
    <p>Your account is waiting for administrator approval. You'll be able to sign in as soon as it's activated.</p>
    <div class="req-box" id="requestInfo">Request submitted successfully.</div>
    <button class="primary-btn" onclick="location.href='login.html'">Back to sign in</button>
  </div>
</div>
<script src="access_store.js"></script>
<script>
const q=new URLSearchParams(location.search).get('email'),r=RestaurantAccess.get().requests.find(x=>x.email===q);
document.getElementById('requestInfo').innerHTML=r?'<b>'+r.name+'</b><br>'+r.email+'<br>Status: <b style="color:var(--warn)">Pending admin approval</b>':'Request submitted successfully.';
</script>
</body>
</html>
